<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Living Sector · Живая галактика</title>
<style>
:root{color-scheme:dark;font:14px system-ui;color:#d7e4ee;background:#080f18}*{box-sizing:border-box}body{margin:0}header{height:68px;border-bottom:1px solid #293747;display:flex;align-items:center;gap:18px;padding:0 22px;background:#101a26}h1{font-size:18px;letter-spacing:2px;margin:0}small,.muted{color:#8d9fb1}button,select,a.button{border:1px solid #35495e;background:#172638;color:#dcecff;padding:8px 12px;border-radius:5px;cursor:pointer;text-decoration:none}button:hover{background:#263f56}button.active{border-color:#71c8d2;color:#8de2dd}.status{margin-left:auto;color:#79c9ab}.layout{display:grid;grid-template-columns:minmax(420px,1fr) 410px;height:calc(100vh - 68px)}.map{position:relative;min-width:0}iframe{width:100%;height:100%;border:0}.sidebar{overflow:auto;border-left:1px solid #293747;background:#0f1925;padding:18px}h2{font-size:17px;margin:0 0 6px}h3{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:#87a5ba;margin:22px 0 10px}.factions{display:flex;gap:6px;flex-wrap:wrap}.factions button{font-size:11px;flex:1;padding:9px 4px}.card{border:1px solid #293e51;border-radius:8px;padding:13px;margin-top:14px;background:#121f2d}.intent{font-size:22px;line-height:1.3;margin:5px 0 9px;color:#91ded7}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:15px}.stats b{display:block;font-size:20px;color:#e8f0f8}.stats span{font-size:11px;color:#8d9fb1}.bar{height:5px;background:#243449;border-radius:4px;margin:9px 0}.bar i{display:block;background:#65cbc0;height:100%;border-radius:4px}.pill{font-size:11px;background:#24384c;border-radius:4px;padding:4px 6px;display:inline-block;margin:4px 4px 0 0}.row{display:flex;justify-content:space-between;gap:10px;margin:7px 0}.reason{line-height:1.55;font-size:12px;color:#a7bbcd}.event{border-left:2px solid #3a6e82;padding:3px 0 8px 10px;margin:10px 0;font-size:12px;line-height:1.5}.event small{display:block}.warning{color:#e6aa6d}.tabs{display:flex;gap:6px}.note{position:absolute;left:15px;bottom:12px;padding:8px 12px;background:#101b29e8;border:1px solid #304151;font-size:11px;pointer-events:none}.error{color:#f7a895}details summary{cursor:pointer;color:#a1c1d8;font-size:12px}.tech{margin:9px 0;padding-bottom:8px;border-bottom:1px solid #263747}.budget{font-size:12px;color:#b6c8d7}@media(max-width:1000px){.layout{grid-template-columns:1fr 340px}header{gap:8px;padding:0 10px}h1{font-size:14px}}@media(max-width:720px){.layout{display:block;height:auto}.map{height:55vh}.sidebar{border-left:0}header{height:auto;min-height:80px;flex-wrap:wrap;padding:10px}.status{margin-left:0}}
</style>
<header><div><h1>LIVING SECTOR</h1><small>ЖИВАЯ ГАЛАКТИКА · GENESIS 0.2</small></div><button id="pause">Пауза</button><select id="speed" aria-label="Скорость"><option value="1">×1</option><option value="2">×2</option><option value="4">×4</option><option value="8">×8</option><option value="16" selected>×16</option></select><a class="button" href="/observer/governance.html">Управление фракцией</a><a class="button" href="/observer/native.html" target="_blank">Инспектор</a><button id="export">Снимок</button><div class="status" id="status">Соединение…</div></header>
<div class="layout"><section class="map"><iframe src="/observer/native.html?embed=map" title="Карта Genesis"></iframe><div class="note">Клик — выбор объекта · Колесо — масштаб · Карта показывает реальные корабли и станции</div></section><aside class="sidebar"><div class="factions" id="factions"></div><div id="content"><h2>Подключение к симуляции</h2><p>Запустите START-GALAXY.cmd и дождитесь сервера.</p></div></aside></div>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={economist:'Экономист',pacifist:'Пацифист',aggressor:'Агрессор',expansionist:'Экспансионист',technocrat:'Технократ',isolationist:'Изоляционист',research:'Исследования',expand:'Экспансия',build:'Развитие промышленности',deliver:'Снабжение',wait:'Накопление ресурсов',stabilize:'Стабилизация',found_colony:'Новая колония',supply_colony:'Снабжение экспедиции',technology_completed:'Технология открыта',colony_completed:'Колония построена',contract_completed:'Контракт исполнен',industrial_accident:'Промышленная авария',paid_research_shift:'Оплачена научная смена',completed:'Завершено',executed:'Исполнено',selected:'Выбрано',blocked:'Заблокировано',best_projected_relief:'Устранение дефицита с учётом характера и затрат',wait_no_positive_option:'Нет выгодного выполнимого проекта',no_current_problem:'Текущие потребности закрыты',no_colony_target:'Нет подходящей свободной планеты',requires_orbital_habitats:'Нужны орбитальные поселения',requires_deep_navigation:'Нужна межзвёздная навигация',insufficient_colony_budget:'Недостаточно бюджета экспедиции',insufficient_affordable_metals:'Не хватает доступных металлов',no_passenger_transport:'Нет подходящего транспорта людей',no_viable_local_carrier:'Нет готового грузового корабля',no_viable_local_builder:'Нет готового строительного корабля',colony_contract_in_progress:'Действующий рейс экспедиции',awaiting_paid_labor:'Ожидание строителя и оплаченного труда',ready:'Предпосылки проверены',survival_first:'Сначала жизнеобеспечение',needs_local_electronics_and_free_workers:'Нет материалов или свободных работников',insufficient_settlers:'Недостаточно переселенцев'};
const label=x=>esc(names[x]||x);
const cargoNames={food:"еда",water:"вода",metals:"металлы",ore:"руда",ice:"лёд",gas:"газ",fuel:"топливо",electronics:"электроника"};
const stateNames={posted:"ищет исполнителя",accepted:"исполняется",picked_up:"груз на борту",delivered:"доставлено"};let selected=null,running=true,last=null,busy=false;
async function api(path,body){const r=await fetch('/api/'+path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(path+': '+r.status);return r.json();}
function render(s,fs,h){last={strategy:s,factions:fs,health:h};const factions=Array.isArray(fs)?fs:(fs.data||fs.factions||[]);if(!selected&&factions.length)selected=factions[0].id;
 $('factions').innerHTML=factions.map(f=>`<button data-id="${esc(f.id)}" class="${selected===f.id?'active':''}" style="border-top:3px solid ${esc(f.colors?.primary||'#729bb7')}">${esc(f.name)}</button>`).join('');
 $('factions').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.id;render(s,fs,h)});
 const c=s.commanders?.[selected],f=factions.find(x=>x.id===selected),v=s.factions?.find(x=>x.faction_id===selected);$('status').className='status';running=h.running!==false;$('pause').textContent=running?'Пауза':'Продолжить';$('status').textContent=`Тик ${s.snapshot_tick??'—'} · ${h.running===false?'пауза':'симуляция'}`;
 if(!c){$('content').innerHTML='<h3>Ожидание первого решения</h3><p class="reason">Главы принимают решения по игровому времени. При ×16 первый цикл занимает несколько секунд. Для этой панели нужен запуск START-GALAXY.cmd.</p>';return;}
 if([...$('speed').options].some(o=>Number(o.value)===h.world_speed))$('speed').value=String(h.world_speed);
 const techOpen=$("content").querySelector("details")?.open;
 const projectTitle=p=>{
   const passenger=s.orders?.some(o=>o.target_id===p.contract_id&&o.kind==="passenger");
   if(passenger)return `Переселение · ${esc(p.quantity)} чел.`;
   const action=p.administrator==="construction"?"Строительные материалы":"Поставка";
   return `${action} · ${esc(p.quantity)} ${esc(cargoNames[p.commodity]||p.commodity)}`;
 };
 const active=(v?.projects||[]).filter(p=>['posted','accepted','picked_up','delivered'].includes(p.state)).slice(0,8);
 const ai=s.ai_execution||{}; const plan=ai.active?.[selected]; const retry=ai.deferred_goals?.[selected];
 const outcomes=Array.isArray(ai.history)?ai.history.filter(o=>o.faction_id===selected).slice(-3).reverse():[];
 const verified=o=>o.final_status==='completed'&&Number.isSafeInteger(o.goal?.target_units)&&o.goal.target_units>0&&
   Array.isArray(o.steps)&&o.steps.length>0&&o.steps.every(r=>r.phase==='succeeded'&&r.native_order_id)&&
   ((o.reason==='native_receipts_and_goal_stock_confirmed'&&
     Number.isFinite(o.observed_goal_stock)&&o.observed_goal_stock>=o.goal.target_units)||
    (o.reason==='native_recipe_receipts_and_goal_production_confirmed'&&
     Number.isSafeInteger(o.required_goal_production_units)&&o.required_goal_production_units>0&&
     o.required_goal_production_units<=o.goal.target_units&&
     Number.isFinite(o.produced_goal_units)&&o.produced_goal_units+0.0001>=o.required_goal_production_units&&
     o.steps.some(r=>String(r.native_order_id).startsWith('facility:')&&
       r.reason_code==='native_recipe_paid_and_output_counter_confirmed')));
 const aiInfo=plan ? `<div class="card"><small>НАТИВНЫЙ ИИ · АКТИВНЫЙ ПЛАН</small><div class="intent">${esc(cargoNames[plan.goal?.commodity]||plan.goal?.commodity)} → ${esc(plan.goal?.destination_id)}</div><div class="reason">Алгоритм: ${esc(plan.ledger?.planner_id)} · Шагов подтверждено: ${(plan.ledger?.steps||[]).filter(r=>r.phase==='succeeded').length}/${(plan.ledger?.steps||[]).length}</div><div class="reason">${esc(plan.last_reason||'Ожидание игрового выполнения')}</div><div class="reason">${(plan.ledger?.steps||[]).map(r=>`<div class="row"><span>${esc(r.step?.action_id)}</span><span>${esc(r.phase)} · ${esc(r.native_order_id||'нет заказа')}</span></div>`).join('')}</div></div>`:
   `<div class="card"><small>НАТИВНЫЕ ПЛАНЫ HTN / HYBRID</small><p class="reason">${s.ai_execution ? "Активного плана нет. Это не означает, что задача выполнена." : "Сервер не передал данные исполнения ИИ."}</p></div>`;
 const retryInfo=retry?`<div class="card"><small>ОТЛОЖЕННАЯ ЦЕЛЬ ИИ</small><div class="reason">${esc(cargoNames[retry.goal?.commodity]||retry.goal?.commodity)} → ${esc(retry.goal?.destination_id)} · попыток: ${esc(retry.failed_attempts)}</div><div class="reason">${esc(retry.last_reason)}</div></div>`:'';
 const outcomesInfo=outcomes.length?`<div class="card"><small>РЕЗУЛЬТАТЫ НАТИВНЫХ ПЛАНОВ</small>${outcomes.map(o=>`<div class="event"><div>${esc(o.planner_id)} · ${verified(o)?(o.reason==='native_recipe_receipts_and_goal_production_confirmed'?'Подтверждён выпуск; остаток отдельно':'Подтверждён запас и квитанции'):esc(o.final_status==='completed'?'Заявлено завершение, доказательств недостаточно':o.final_status)}</div><small>${esc(o.reason)} · тик ${esc(o.tick)}</small></div>`).join('')}</div>`:'';

 const tech=s.technologies||[],current=tech.find(t=>t.id===c.research);const history=[...c.history].reverse().slice(0,24);
 $('content').innerHTML=`<h3>Глава фракции</h3><h2>${esc(f?.name)}</h2><div>${Object.entries(c.profile.archetypes).map(([k,v])=>`<span class="pill">${label(k)} ${Math.round(v*100)}%</span>`).join('')}</div><div class="card"><small>ТЕКУЩЕЕ РЕШЕНИЕ · С ТИКА ${c.since}</small><div class="intent">${label(c.intent)}</div><div class="reason ${c.crisis?'warning':''}">${label(c.reason)}</div><div class="stats"><div><b>${c.stations}</b><span>станций</span></div><div><b>${c.colonies}</b><span>новых колоний</span></div><div><b>${c.technologies.length}</b><span>технологий</span></div></div><p class="budget">Казна: ${Number(f?.treasury||0).toLocaleString('ru')} CR · Контракты: ${c.completed_contracts}</p></div>
 <h3>Научная программа</h3><div class="card"><b>${esc(current?.name||(c.technologies.length===tech.length?'Программа завершена':'Выбор следующей темы'))}</b><div class="bar"><i style="width:${Math.min(100,c.progress/Math.max(1,c.research_required)*100)}%"></i></div><div class="row"><small>${c.progress} / ${c.research_required} единиц труда</small><small>10 работников / смена</small></div><div class="reason">${esc(current?.effect||'Следующий набор технологий пока не реализован.')}</div></div>
 <h3>Активные приказы</h3>${active.length?active.map(p=>`<div class="event"><b>${projectTitle(p)}</b><div class="reason">${esc(p.source)} → ${esc(p.destination)}</div><small>${esc(stateNames[p.state]||p.state)}${p.executor_id?' · '+esc(p.executor_id):''}</small></div>`).join(''):'<div class="reason">Нет оплаченных рейсов в работе.</div>'}
 <h3>Почему этот вариант</h3>${c.candidates.map(a=>`<div class="row"><div><b>${label(a.action)}</b><div class="reason">${label(a.reason)}</div></div><span class="${a.available?'':'muted'}">${a.available?a.score.toFixed(1):'—'}</span></div>`).join('')}<div class="reason">Оценки — предпочтения главы, не игровые деньги. Невыполнимые действия исключаются.</div>
 <h3>Технологии</h3><details ${techOpen?"open":""}><summary>Возможности и зависимости</summary>${tech.map(t=>`<div class="tech"><b>${c.technologies.includes(t.id)?'✓':'○'} ${esc(t.name)}</b><div class="reason">${esc(t.effect)}</div><small>Требует: ${esc(tech.find(x=>x.id===t.prerequisite)?.name||'начальные знания')}</small></div>`).join('')}</details>
 <h3>Хроника решений</h3>${history.map(e=>`<div class="event"><small>ТИК ${e.tick} · ${label(e.outcome)}</small><b>${label(e.action)}</b><div class="reason">${esc(tech.find(t=>t.id===e.reason)?.name||names[e.reason]||e.reason)}</div></div>`).join('')}${aiInfo}${retryInfo}${outcomesInfo}`;
}
async function poll(){if(busy)return;busy=true;try{const [s,f,h]=await Promise.all([api('strategy'),api('factions'),api('health')]);render(s,f,h);}catch(e){$('status').textContent='Нет соединения: '+e.message;$('status').className='status error';}finally{busy=false;}}
$('pause').onclick=async()=>{try{await api('sim/'+(running?'pause':'resume'),{});running=!running;$('pause').textContent=running?'Пауза':'Продолжить';await poll();}catch(e){$('status').textContent=e.message;}};
$('speed').onchange=async()=>{try{const speed=Number($('speed').value);await api('sim/speed',{world_speed:speed,ticks_per_second:speed});}catch(e){$('status').textContent=e.message;}};
$('export').onclick=()=>{if(!last)return;const url=URL.createObjectURL(new Blob([JSON.stringify(last,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='living-sector-snapshot.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
poll();setInterval(poll,1500);
</script></html>
