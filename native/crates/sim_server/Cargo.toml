[package]
name = "sim_server"
version.workspace = true
edition.workspace = true

[lib]
name = "sim_server"
path = "src/lib.rs"

# Phase D: the standalone `simulator` binary is retired. The headless
# server lives in `sim_server::runtime::run()` and is launched by
# `client_bevy --headless` (see crates/client_bevy/src/main.rs). The
# sim_server crate stays as a [lib] until a future Phase D-tail folds
# its HTTP/WS/engine modules into client_bevy directly.

[dependencies]
sim_core = { path = "../sim_core" }
sim_db = { path = "../sim_db" }
sim_protocol = { path = "../sim_protocol" }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
dashmap = { workspace = true }
flume = { workspace = true }
rayon = { workspace = true }
arc-swap = { workspace = true }
bevy_ecs = { workspace = true }
# bevy_tasks: explicit dep so sim_server can init ComputeTaskPool for
# the parallel ship sub-phases (see Phase C in the migration plan).
# Pinned to match bevy_ecs's transitive version.
bevy_tasks = "0.18"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }

# Match sqlx's transitive libsqlite3-sys version and enable bundled (static) SQLite.
# Needed for Windows cross-compile — no system sqlite3.dll required.
libsqlite3-sys = { version = "0.28", features = ["bundled"] }

# WebSocket framing
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Env vars from .env file
dotenvy = "0.15"

# POSIX `kill(pid, 0)` for the parent-process watcher so a crashed
# Godot can't leave the sim orphaned. Already a transitive dep of
# tokio; making it explicit so the use is obvious.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows equivalent: OpenProcess + GetExitCodeProcess. Same polling
# contract as the POSIX side so the upstream watcher task stays
# platform-agnostic.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
