name: Genesis small-seed preview

on:
  push:
    branches: [feature/genesis-0-1]
    paths:
      - "Start-Genesis.cmd"
      - "priv/genesis/**"
      - "observer/**"
      - "tests/genesis-seed.test.mjs"
      - ".github/workflows/genesis-seed.yml"
  pull_request:
    branches: [feature/observer-focused-ui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-preview:
    name: Genesis data checks and lightweight Windows overlay
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated world topology, economy inputs, ship count
        run: node --test tests/genesis-seed.test.mjs
      - name: Check Observer JavaScript and adapter tests
        run: |
          node --check observer/app.js
          node --check observer/model.js
          node --test observer/model.test.mjs
      - name: Package seed without native compilation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          Path("dist").mkdir(exist_ok=True)
          with ZipFile("dist/Genesis-Seed-Preview.zip", "w", ZIP_DEFLATED) as z:
              z.write("Start-Genesis.cmd")
              for p in Path("priv/genesis/data").rglob("*.json"):
                  z.write(p, p.as_posix())
              z.write("docs/living-sector/GENESIS_0_1_STATUS.md", "GENESIS-README.md")
          PY
      - name: Package browser-only visual patch
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          files = ("index.html", "styles.css", "app.js", "model.js")
          with ZipFile("dist/Genesis-Map-UI-Patch.zip", "w", ZIP_DEFLATED) as z:
              for filename in files:
                  z.write("observer/" + filename, "observer/" + filename)
              z.writestr("README-UI-PATCH.txt",
                  "Living Sector Genesis map UI patch; no native EXE rebuild required.\n"
                  "Close only the Observer browser tab. The simulator can continue running.\n"
                  "Extract into the folder containing Living-Sector.exe; replace observer files.\n"
                  "Open or hard-refresh (Ctrl+F5) /observer. Save DB files are untouched.\n"
                  "Needs a recent EXE that loads external observer/ assets.\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Genesis-Map-UI-Patch
          path: dist/Genesis-Map-UI-Patch.zip
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Genesis-Seed-Preview
          path: dist/Genesis-Seed-Preview.zip
          retention-days: 7
          if-no-files-found: error
