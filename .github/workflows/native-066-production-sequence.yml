name: Galaxy 0.6.6 - real production sequence

on:
  push:
    branches:
      - feature/galaxy-066-native-production-sequence
    paths:
      - 'native/crates/sim_core/src/strategy.rs'
      - 'native/crates/sim_core/src/strategy/construction.rs'
      - 'native/crates/sim_core/src/strategy/production_chain.rs'
      - 'native/crates/sim_core/src/strategy/station.rs'
      - 'native/crates/sim_core/src/strategy/station/tests.rs'
      - 'native/observer/governance-economy.html'
      - '.github/workflows/native-066-production-sequence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test only native production-stage and previous construction contracts
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p sim_core --lib galaxy066 -- --nocapture
          cargo test --locked -p sim_core --lib strategy_block_construction -- --nocapture
      - name: Check native Observer economic sequence page JS
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html=Path('observer/governance-economy.html').read_text()
          assert html.count('<script>')==1 and html.count('</script>')==1
          Path('/tmp/ls-066-sequence.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/ls-066-sequence.js
      - name: Scope boundary
        if: always()
        run: |
          echo 'Native construction, delivery, paid labor, input readiness and production shift receipt. No full-world replay or Windows build.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Sequence is read-only. Existing station AI only changes staff allocation to a feasible local precursor.' >> "$GITHUB_STEP_SUMMARY"
