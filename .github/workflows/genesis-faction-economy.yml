name: Genesis - shared factions and finite salvage

on:
  push:
    branches: [feature/genesis-faction-economy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-economy:
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Seed and Observer checks
        shell: pwsh
        run: |
          node --check observer/app.js
          node --check observer/model.js
          node --test tests/genesis-seed.test.mjs observer/model.test.mjs
      - name: Shared faction diplomacy / supply and finite salvage tests
        shell: pwsh
        run: |
          cargo test --locked -p sim_core genesis_commerce_tests -- --nocapture
          cargo test --locked -p sim_core genesis_faction_logistics_tests -- --nocapture
          cargo test --locked -p sim_core salvage_field_tests -- --nocapture
      - name: Compile real ECS + AI + SQLite native server
        shell: pwsh
        run: cargo build --locked --release -p sim_server --bin genesis_server
      - name: Smoke-test fresh two-faction finite economy and War embargo
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:DATABASE_PATH = Join-Path (Get-Location) "genesis-factions-ci.db"
          $env:DATA_DIR = (Resolve-Path "priv/genesis/data").Path
          $env:LIVING_SECTOR_UI_DIR = (Resolve-Path "observer").Path
          $env:BIND_ADDR = "127.0.0.1:18086"
          $env:WORLD_SPEED = "16.0"
          $proc = Start-Process -FilePath (Resolve-Path "target/release/genesis_server.exe").Path -PassThru
          try {
            $verified = $false
            for ($i=0; $i -lt 90; $i++) {
              if ($proc.HasExited) { throw "Server crashed: $($proc.ExitCode)" }
              try {
                $report = Invoke-RestMethod "http://127.0.0.1:18086/api/report" -TimeoutSec 3
                if (@($report.systems).Count -ne 1) { throw "Expected one system" }
                if (@($report.factions).Count -ne 2) { throw "Expected two actual factions" }
                if (@($report.ships).Count -ne 8) { throw "Expected eight ship agents" }
                if (@($report.facilities).Count -ne 14) { throw "Expected fourteen facilities" }
                if (@($report.markets).Count -ne 6) { throw "Expected six local markets" }
                $rels = Invoke-RestMethod "http://127.0.0.1:18086/api/factions/relations" -TimeoutSec 3
                if (@($rels.data | Where-Object { $_.treaty -eq "war" }).Count -lt 1) {
                  Start-Sleep -Seconds 1
                  continue
                }
                $controllers = @{}
                foreach ($fac in @($report.facilities)) {
                  if ($fac.location_name -and $fac.faction_id) {
                    $controllers[$fac.location_name] = $fac.faction_id
                  }
                }
                $contractResp = Invoke-RestMethod "http://127.0.0.1:18086/api/contracts" -TimeoutSec 3
                foreach ($c in @($contractResp.data)) {
                  if (-not $c.faction_id) { continue }
                  foreach ($loc in @($c.source_location,$c.destination_location)) {
                    if ($loc -and $controllers.ContainsKey($loc) -and $controllers[$loc] -ne $c.faction_id) {
                      throw "Hostile trade contract: $($c.faction_id) $($c.source_location) -> $($c.destination_location)"
                    }
                  }
                }
                $verified = $true
                break
              } catch {
                if ($i -gt 20) { throw }
              }
              Start-Sleep -Seconds 1
            }
            if (-not $verified) { throw "No verified live economy or War relations" }
            $page=Invoke-WebRequest "http://127.0.0.1:18086/observer" -UseBasicParsing
            if ($page.StatusCode -ne 200) { throw "Observer missing" }
            Write-Host "PASS: 2 real ECS factions, 8 ships, 14 facilities, 6 markets, War relation and no hostile contracts"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Package isolated 2-faction Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "dist/Genesis-Faction-Economy"
          New-Item -Path "$root/observer" -ItemType Directory -Force | Out-Null
          New-Item -Path "$root/priv/genesis/data" -ItemType Directory -Force | Out-Null
          Copy-Item "target/release/genesis_server.exe" "$root/Genesis-Server.exe"
          Copy-Item "Start-Genesis.cmd" "$root/Start-Genesis.cmd"
          Copy-Item "LICENSE" "$root/LICENSE"
          Copy-Item "observer/index.html","observer/styles.css","observer/app.js","observer/model.js" "$root/observer/"
          Copy-Item "priv/genesis/data/*" "$root/priv/genesis/data/" -Recurse
          @(
            "Living Sector Genesis: 2-faction ECS economy preview"
            "Start via Start-Genesis.cmd. Save: genesis-faction-economy-v1.db."
            "All War/Hostile trade is forbidden. Own market supply receives priority."
            "Pirates are an outlaw faction with permanent War against others."
            "Wreckage salvage = 1/3 standard extraction rate; stock is finite and persisted."
            "Raids, combat and hull construction are not implemented."
            "Observer is the original browser UI; advanced Clean 0.14 UI is separate."
          ) | Set-Content "$root/README.txt" -Encoding UTF8
          Compress-Archive -Path "$root" -DestinationPath "dist/Living-Sector-Genesis-Faction-Economy-Windows.zip" -CompressionLevel Optimal -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Living-Sector-Genesis-Faction-Economy-Windows
          path: dist/Living-Sector-Genesis-Faction-Economy-Windows.zip
          if-no-files-found: error
          retention-days: 10
