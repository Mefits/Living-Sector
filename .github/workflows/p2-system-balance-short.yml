name: Living Sector SystemBalance geometry and orbital intercept short gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intercept:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install original Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 150 --silent --show-error \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q -j "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import all scripts to detect parser errors
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s godot --headless --path godot --editor --import --quit >"$RUNNER_TEMP/parse.log" 2>&1 || {
            tail -n 140 "$RUNNER_TEMP/parse.log"; exit 1;
          }
      - name: Sol station slow orbital phase, 800 km height, click/zoom LOD and native N43 match
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 40s godot --headless --path godot --script res://tests/p2_slow_sol_station_lod_check.gd >"$RUNNER_TEMP/sol_slow_station.log" 2>&1 || {
            tail -n 150 "$RUNNER_TEMP/sol_slow_station.log"; exit 1;
          }
          grep -q 'P2 SLOW SOL STATION PASS' "$RUNNER_TEMP/sol_slow_station.log" || {
            tail -n 150 "$RUNNER_TEMP/sol_slow_station.log"; exit 1;
          }
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|P2 SLOW SOL STATION FAIL:' "$RUNNER_TEMP/sol_slow_station.log"; then
            tail -n 150 "$RUNNER_TEMP/sol_slow_station.log"; exit 1;
          fi
          grep 'P2 SLOW SOL STATION PASS' "$RUNNER_TEMP/sol_slow_station.log"
      - name: Sol station/N14 native dock screen coherence and actual departure/arrival
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 40s godot --headless --path godot --script res://tests/p2_sol_station_ship_alignment_check.gd >"$RUNNER_TEMP/dock_alignment.log" 2>&1 || {
            tail -n 140 "$RUNNER_TEMP/dock_alignment.log"; exit 1;
          }
          grep -q 'P2 SOL STATION SHIP ALIGNMENT PASS' "$RUNNER_TEMP/dock_alignment.log" || {
            tail -n 140 "$RUNNER_TEMP/dock_alignment.log"; exit 1;
          }
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|P2 SOL STATION SHIP ALIGNMENT FAIL:' "$RUNNER_TEMP/dock_alignment.log"; then
            tail -n 140 "$RUNNER_TEMP/dock_alignment.log"; exit 1;
          fi
          grep 'P2 SOL STATION SHIP ALIGNMENT PASS' "$RUNNER_TEMP/dock_alignment.log"
      - name: Sol station and surface production district identity and real N39 economy
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 40s godot --headless --path godot --script res://tests/p2_sol_physical_assets_check.gd >"$RUNNER_TEMP/sol_assets.log" 2>&1 || {
            tail -n 150 "$RUNNER_TEMP/sol_assets.log"; exit 1;
          }
          grep -q 'P2 SOL PHYSICAL ASSETS PASS' "$RUNNER_TEMP/sol_assets.log" || {
            tail -n 150 "$RUNNER_TEMP/sol_assets.log"; exit 1;
          }
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|P2 SOL PHYSICAL ASSETS FAIL:' "$RUNNER_TEMP/sol_assets.log"; then
            tail -n 140 "$RUNNER_TEMP/sol_assets.log"; exit 1;
          fi
          grep 'P2 SOL PHYSICAL ASSETS PASS' "$RUNNER_TEMP/sol_assets.log"
      - name: Click real moving ships and docked fleet; show read-only ship inspector
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 40s godot --headless --path godot --script res://tests/p2_ship_selection_check.gd >"$RUNNER_TEMP/ship_ui.log" 2>&1 || {
            tail -n 150 "$RUNNER_TEMP/ship_ui.log"; exit 1;
          }
          grep -q 'P2 SHIP SELECTION PASS' "$RUNNER_TEMP/ship_ui.log" || {
            tail -n 120 "$RUNNER_TEMP/ship_ui.log"; exit 1;
          }
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|P2 SHIP SELECTION FAIL:' "$RUNNER_TEMP/ship_ui.log"; then
            tail -n 120 "$RUNNER_TEMP/ship_ui.log"; exit 1;
          fi
          grep 'P2 SHIP SELECTION PASS' "$RUNNER_TEMP/ship_ui.log"
      - name: Measure 50 / 500 / 1000 ships on the real Godot map
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s godot --headless --path godot --script res://tests/p2_ship_scale_500_benchmark.gd >"$RUNNER_TEMP/ship_scale.log" 2>&1 || {
            tail -n 140 "$RUNNER_TEMP/ship_scale.log"; exit 1;
          }
          grep -q 'P2 SHIP SCALE PASS' "$RUNNER_TEMP/ship_scale.log" || {
            tail -n 140 "$RUNNER_TEMP/ship_scale.log"; exit 1;
          }
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|P2 SHIP SCALE FAIL:' "$RUNNER_TEMP/ship_scale.log"; then
            tail -n 140 "$RUNNER_TEMP/ship_scale.log"; exit 1;
          fi
          grep 'P2 SHIP SCALE' "$RUNNER_TEMP/ship_scale.log"
      - name: Physical station N43, solar exclusion and paid N14 detour
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 40s godot --headless --path godot --script res://tests/p2_native_navigation_check.gd >"$RUNNER_TEMP/navigation.log" 2>&1 || {
            tail -n 150 "$RUNNER_TEMP/navigation.log"; exit 1;
          }
          grep -q 'P2 NATIVE NAVIGATION PASS' "$RUNNER_TEMP/navigation.log" || {
            tail -n 120 "$RUNNER_TEMP/navigation.log"; exit 1;
          }
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|P2 NATIVE NAVIGATION FAIL:' "$RUNNER_TEMP/navigation.log"; then
            tail -n 120 "$RUNNER_TEMP/navigation.log"; exit 1;
          fi
          grep 'P2 NATIVE NAVIGATION PASS' "$RUNNER_TEMP/navigation.log"
      - name: Real moving planet navigation, physical safe approach and hold
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 45s godot --headless --path godot --script res://tests/p2_moving_planet_avoidance_check.gd >"$RUNNER_TEMP/planet_nav.log" 2>&1 || {
            tail -n 140 "$RUNNER_TEMP/planet_nav.log"; exit 1;
          }
          grep -q 'P2 MOVING PLANET AVOIDANCE PASS' "$RUNNER_TEMP/planet_nav.log" || {
            tail -n 140 "$RUNNER_TEMP/planet_nav.log"; exit 1;
          }
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|P2 MOVING PLANET AVOIDANCE FAIL:' "$RUNNER_TEMP/planet_nav.log"; then
            tail -n 140 "$RUNNER_TEMP/planet_nav.log"; exit 1;
          fi
          grep 'P2 MOVING PLANET AVOIDANCE PASS' "$RUNNER_TEMP/planet_nav.log"
      - name: Smooth real N14 tangent arcs, multi-chord speed and paid fuel
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 40s godot --headless --path godot --script res://tests/p2_smooth_n14_navigation_check.gd >"$RUNNER_TEMP/smooth_nav.log" 2>&1 || {
            tail -n 150 "$RUNNER_TEMP/smooth_nav.log"; exit 1;
          }
          grep -q 'P2 SMOOTH N14 PASS' "$RUNNER_TEMP/smooth_nav.log" || {
            tail -n 120 "$RUNNER_TEMP/smooth_nav.log"; exit 1;
          }
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|P2 SMOOTH N14 FAIL:' "$RUNNER_TEMP/smooth_nav.log"; then
            tail -n 120 "$RUNNER_TEMP/smooth_nav.log"; exit 1;
          fi
          grep 'P2 SMOOTH N14 PASS' "$RUNNER_TEMP/smooth_nav.log"
      - name: Bound actual 500-ship N14 guidance, detour and saved receipt cost
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 45s godot --headless --path godot --script res://tests/p2_n14_nav_500_check.gd >"$RUNNER_TEMP/nav500.log" 2>&1 || {
            tail -n 150 "$RUNNER_TEMP/nav500.log"; exit 1;
          }
          grep -q 'P2 N14 NAV 500 PASS' "$RUNNER_TEMP/nav500.log" || {
            tail -n 140 "$RUNNER_TEMP/nav500.log"; exit 1;
          }
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|P2 N14 NAV 500 FAIL:' "$RUNNER_TEMP/nav500.log"; then
            tail -n 140 "$RUNNER_TEMP/nav500.log"; exit 1;
          fi
          grep 'P2 N14 NAV 500' "$RUNNER_TEMP/nav500.log"
      - name: Native Moon and Callisto parented physics and old-save rejection
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 40s godot --headless --path godot --script res://tests/p2_physical_satellite_orbits_check.gd >"$RUNNER_TEMP/satellites.log" 2>&1 || {
            tail -n 150 "$RUNNER_TEMP/satellites.log"; exit 1;
          }
          grep -q 'P2 PHYSICAL SATELLITES PASS' "$RUNNER_TEMP/satellites.log" || {
            tail -n 120 "$RUNNER_TEMP/satellites.log"; exit 1;
          }
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|P2 PHYSICAL SATELLITES FAIL:' "$RUNNER_TEMP/satellites.log"; then
            tail -n 120 "$RUNNER_TEMP/satellites.log"; exit 1;
          fi
          grep 'P2 PHYSICAL SATELLITES PASS' "$RUNNER_TEMP/satellites.log"
      - name: Real N14 predictive transit and moon geometry regression
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 40s godot --headless --path godot --script res://tests/p2_native_orbital_intercept_check.gd >"$RUNNER_TEMP/n14.log" 2>&1 || {
            tail -n 150 "$RUNNER_TEMP/n14.log"; exit 1;
          }
          grep -q 'P2 NATIVE ORBITAL INTERCEPT PASS' "$RUNNER_TEMP/n14.log" || {
            tail -n 140 "$RUNNER_TEMP/n14.log"; exit 1;
          }
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|P2 NATIVE ORBITAL INTERCEPT FAIL:' "$RUNNER_TEMP/n14.log"; then
            tail -n 140 "$RUNNER_TEMP/n14.log"; exit 1;
          fi
          grep -E 'P2 NATIVE ORBITAL INTERCEPT (COST|PASS)' "$RUNNER_TEMP/n14.log"
      - name: Run frozen N14/N43, real fuel and checkpoint regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in n14_transit_check n43_native_location_resolver_check p2_ship_transit_fuel_check p2_unified_ship_phase_check; do
            echo "N14_ORBIT_REGRESSION $test"
            timeout --signal=TERM --kill-after=5s 40s godot --headless --path godot --script "res://tests/${test}.gd" >"$RUNNER_TEMP/${test}.log" 2>&1 || {
              tail -n 140 "$RUNNER_TEMP/${test}.log"; exit 1;
            }
            if grep -Eq 'SCRIPT ERROR:|Parse Error:|FAIL:' "$RUNNER_TEMP/${test}.log"; then
              tail -n 140 "$RUNNER_TEMP/${test}.log"; exit 1;
            fi
            grep -E 'PASS|pass' "$RUNNER_TEMP/${test}.log" | tail -n 3 || tail -n 6 "$RUNNER_TEMP/${test}.log"
          done
      - name: Five-worker merged event queue and runtime snapshot regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in n3_events_check p2_perf_d_due_bulk_boundary_20261117 p2_perf_d_event_queue_redundant_maps_oracle p2_runtime_read_projection_check; do
            timeout --signal=TERM --kill-after=5s 30s godot --headless --path godot --script "res://tests/${test}.gd" >"$RUNNER_TEMP/${test}.log" 2>&1 || {
              echo "MERGED PERF FAILED: $test"
              tail -n 125 "$RUNNER_TEMP/${test}.log"
              exit 1
            }
            if grep -Eq 'SCRIPT ERROR:|Parse Error:|P2_.*FAIL|EVENTS_.*FAIL' "$RUNNER_TEMP/${test}.log"; then
              echo "MERGED PERF ERROR: $test"
              tail -n 125 "$RUNNER_TEMP/${test}.log"
              exit 1
            fi
            echo "MERGED PERF REGRESSION: $test"
            grep -E 'PASS|pass' "$RUNNER_TEMP/${test}.log" | tail -n 2 || true
          done
      - name: Real F5 worker station GUI boot and N38 save roundtrip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sol-ui-worker"
          timeout --signal=TERM --kill-after=5s 65s env XDG_DATA_HOME="$RUNNER_TEMP/sol-ui-worker" godot --headless --path godot -- --p2-worker-gui-check >"$RUNNER_TEMP/sol_worker.log" 2>&1 || {
            tail -n 150 "$RUNNER_TEMP/sol_worker.log"; exit 1;
          }
          grep -q 'P2_WORKER_GUI_BOOT_CHECK_PASS' "$RUNNER_TEMP/sol_worker.log" || {
            tail -n 150 "$RUNNER_TEMP/sol_worker.log"; exit 1;
          }
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|P2_WORKER_GUI_BOOT_CHECK_FAIL:' "$RUNNER_TEMP/sol_worker.log"; then
            tail -n 150 "$RUNNER_TEMP/sol_worker.log"; exit 1;
          fi
          grep 'P2_WORKER_GUI_BOOT_CHECK_PASS' "$RUNNER_TEMP/sol_worker.log"
      - name: 500 actual paid native N158 ticks on merged balance plus performance code
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 335s godot --headless --path godot --script res://tests/p2_perf_pr262_head_500_tick_smoke.gd >"$RUNNER_TEMP/merged500.log" 2>&1 || {
            tail -n 180 "$RUNNER_TEMP/merged500.log"
            exit 1
          }
          grep -q 'P2_PR262_HEAD_500_TICK_PASS' "$RUNNER_TEMP/merged500.log" || {
            tail -n 180 "$RUNNER_TEMP/merged500.log"
            exit 1
          }
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|P2_PR262_HEAD_500_TICK_FAIL' "$RUNNER_TEMP/merged500.log"; then
            tail -n 180 "$RUNNER_TEMP/merged500.log"
            exit 1
          fi
          grep -E 'P2_PR262_HEAD_500_TICK_(WINDOW|PASS)' "$RUNNER_TEMP/merged500.log"
      - name: Verify existing seamless Sol zoom
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 30s godot --headless --path godot --script res://tests/p2_seamless_zoom_check.gd >"$RUNNER_TEMP/sol.log" 2>&1 || {
            tail -n 120 "$RUNNER_TEMP/sol.log"; exit 1;
          }
          grep -q 'P2 SEAMLESS ZOOM PASS' "$RUNNER_TEMP/sol.log" || {
            tail -n 120 "$RUNNER_TEMP/sol.log"; exit 1;
          }
      - name: Logs on failure
        if: failure()
        shell: bash
        run: |
          for f in "$RUNNER_TEMP/parse.log" "$RUNNER_TEMP/sol_assets.log" "$RUNNER_TEMP/sol_slow_station.log" "$RUNNER_TEMP/dock_alignment.log" "$RUNNER_TEMP/ship_ui.log" "$RUNNER_TEMP/ship_scale.log" "$RUNNER_TEMP/navigation.log" "$RUNNER_TEMP/planet_nav.log" "$RUNNER_TEMP/smooth_nav.log" "$RUNNER_TEMP/nav500.log" "$RUNNER_TEMP/satellites.log" "$RUNNER_TEMP/n14.log" "$RUNNER_TEMP/sol.log" "$RUNNER_TEMP/sol_worker.log" "$RUNNER_TEMP/merged500.log"; do
            if test -f "$f"; then echo "--- $f"; tail -n 140 "$f"; fi
          done
