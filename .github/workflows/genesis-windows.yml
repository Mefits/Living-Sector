name: Living Sector Genesis - complete Windows build

on:
  push:
    branches: [feature/genesis-0-1]
    paths:
      - ".github/workflows/genesis-windows.yml"
      - "crates/**"
      - "observer/**"
      - "priv/genesis/**"
      - "Start-Genesis.cmd"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genesis-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  genesis-windows:
    name: Complete Genesis Windows x64 package and smoke test
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Validate browser and Genesis seed
        shell: pwsh
        run: |
          node --check observer/model.js
          node --check observer/app.js
          node --test observer/model.test.mjs tests/genesis-seed.test.mjs
      - name: Compile complete Rust engine and Windows client
        shell: pwsh
        run: cargo build --locked --release -p client_bevy
      - name: Verify boot snapshots and isolated Genesis database
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:DATABASE_PATH = Join-Path (Get-Location) "genesis-smoke.db"
          $env:DATA_DIR = (Resolve-Path "priv/genesis/data").Path
          $env:BIND_ADDR = "127.0.0.1:18080"
          $env:WORLD_SPEED = "0.25"
          $process = Start-Process -FilePath (Resolve-Path "target/release/client_bevy.exe").Path -ArgumentList "--headless" -PassThru
          try {
            $report = $null
            for ($i=0; $i -lt 150; $i++) {
              if ($process.HasExited) { throw "Genesis server exited early: $($process.ExitCode)" }
              try {
                $report = Invoke-RestMethod -Uri "http://127.0.0.1:18080/api/report" -TimeoutSec 3
                if ($null -ne $report -and $report.systems.Count -gt 0) { break }
              } catch {
                Start-Sleep -Seconds 2
              }
            }
            if ($null -eq $report) { throw "Genesis did not expose API report" }
            # Assert every category while the engine is initially running.
            if ($report.systems.Count -ne 1) { throw "Expected 1 system, got $($report.systems.Count)" }
            if ($report.systems[0].bodies.Count -ne 4) { throw "Expected 4 bodies, got $($report.systems[0].bodies.Count)" }
            if ($report.factions.Count -ne 1) { throw "Expected 1 faction, got $($report.factions.Count)" }
            if ($report.ships.Count -ne 3) { throw "Expected 3 ships, got $($report.ships.Count)" }
            if ($report.facilities.Count -ne 6) { throw "Expected 6 facilities, got $($report.facilities.Count)" }
            if ($report.markets.Count -ne 2) { throw "Expected 2 markets, got $($report.markets.Count)" }
            # Verify a pause cannot erase slow-cadence caches.
            Invoke-RestMethod -Uri "http://127.0.0.1:18080/api/sim/pause" -Method Post -ContentType "application/json" -Body '{}' -TimeoutSec 5 | Out-Null
            Start-Sleep -Seconds 2
            $paused = Invoke-RestMethod -Uri "http://127.0.0.1:18080/api/report" -TimeoutSec 5
            if ($paused.systems[0].bodies.Count -ne 4 -or $paused.factions.Count -ne 1 -or
                $paused.facilities.Count -ne 6 -or $paused.markets.Count -ne 2) {
              throw "Paused snapshot lost one or more categories"
            }
            Write-Host "PASS: Sol + 4 bodies + 1 faction + 3 ships + 6 facilities + 2 markets; pause preserved state."
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Create ready-to-run Genesis distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $folder = "dist/Living-Sector-Genesis"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item "target/release/client_bevy.exe" "$folder/Living-Sector.exe"
          Copy-Item "priv" "$folder/priv" -Recurse
          Copy-Item "observer" "$folder/observer" -Recurse
          Copy-Item "crates/client_bevy/assets" "$folder/assets" -Recurse
          Copy-Item "Start-Genesis.cmd" "$folder/Start-Genesis.cmd"
          Copy-Item "LICENSE" "$folder/LICENSE"
          @(
            "LIVING SECTOR - GENESIS 0.1 PREVIEW"
            ""
            "1. Extract the full Living-Sector-Genesis folder to a new location."
            "2. Launch Start-Genesis.cmd (NOT Living-Sector.exe directly)."
            "3. The Observer opens in your web browser."
            "4. If an older simulator is still running on port 8080, stop it with Ctrl+C."
            "5. This build uses genesis.db only; it does not touch your original sim.db."
            "6. To keep progress from an earlier Genesis, copy genesis.db into this new folder only after a clean shutdown."
            ""
            "Implemented: small isolated Sol, physical market shipping, existing mining facilities, Observer, world-grid zoom, startup snapshots."
            "NOT implemented yet: multiple ore species, power-grid model, ship hull production, faction executive/administrator planners."
            "The exe retains the old Bevy GUI on direct launch; the intended Genesis entry point is Start-Genesis.cmd."
          ) | Set-Content "$folder/README.txt" -Encoding UTF8
          Compress-Archive -Path $folder -DestinationPath "dist/Living-Sector-Genesis-Windows.zip" -CompressionLevel Optimal -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Living-Sector-Genesis-Windows
          path: dist/Living-Sector-Genesis-Windows.zip
          retention-days: 7
          if-no-files-found: error
