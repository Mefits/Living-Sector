name: PERF RECOVERY opt-in short check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p2-perf-recovery-short
  cancel-in-progress: true
jobs:
  actual-paid-tick-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/perf-recovery"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 150 --silent --show-error https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q -j "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/perf-recovery"
          mv "$RUNNER_TEMP/perf-recovery/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/perf-recovery/godot"
          chmod +x "$RUNNER_TEMP/perf-recovery/godot"
          echo "$RUNNER_TEMP/perf-recovery" >> "$GITHUB_PATH"
      - name: Import and compile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/logs/perf-recovery
          timeout 65 godot --headless --path godot --editor --import --quit >godot/logs/perf-recovery/import.log 2>&1
          timeout 45 godot --headless --path godot --script res://tests/p2_unified_script_compile_check.gd >godot/logs/perf-recovery/compile.log 2>&1
          if grep -Eq 'SCRIPT ERROR:|Parse Error:' godot/logs/perf-recovery/{import,compile}.log; then tail -n 100 godot/logs/perf-recovery/compile.log; exit 1; fi
      - name: Worker boot and N38
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/perf-recovery-user"
          timeout 45 env XDG_DATA_HOME="$RUNNER_TEMP/perf-recovery-user" godot --headless --path godot -- --p2-worker-gui-check >godot/logs/perf-recovery/worker.log 2>&1
          grep P2_WORKER_GUI_BOOT_CHECK_PASS godot/logs/perf-recovery/worker.log
      - name: Two fast targeted invariants (no simulation soak)
        shell: bash
        run: |
          set -euo pipefail
          timeout 20 godot --headless --path godot --script res://tests/p2_late_growth_weak_parent_check.gd >godot/logs/perf-recovery/ledger.log 2>&1
          grep -q LATE_GROWTH_WEAK_PARENT_PASS godot/logs/perf-recovery/ledger.log
          timeout 20 godot --headless --path godot --script res://tests/p2_runtime_read_projection_check.gd >godot/logs/perf-recovery/projections.log 2>&1
          grep -q 'runtime read projection isolation: PASS' godot/logs/perf-recovery/projections.log
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-recovery-gate0-logs
          path: godot/logs/perf-recovery/
          retention-days: 2
