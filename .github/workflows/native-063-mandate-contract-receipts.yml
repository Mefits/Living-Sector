name: Galaxy 0.6.3 - one focused mandate receipt regression

on:
  push:
    branches:
      - feature/galaxy-063-mandate-contract-receipts
    paths:
      - 'native/crates/sim_core/src/strategy.rs'
      - 'native/crates/sim_core/src/strategy/coordination.rs'
      - 'native/crates/sim_core/src/strategy/economic_mandate.rs'
      - 'native/crates/sim_core/src/strategy/economic_proposal.rs'
      - 'native/observer/governance-approvals.html'
      - '.github/workflows/native-063-mandate-contract-receipts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-governance-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and execute only Galaxy 0.6.3 approval/receipt tests
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p sim_core --lib galaxy063 -- --nocapture
      - name: Syntax check of actual player approval page
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html=Path('observer/governance-approvals.html').read_text()
          assert html.count('<script>')==1 and html.count('</script>')==1
          Path('/tmp/galaxy063-approval.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/galaxy063-approval.js
      - name: Scope boundary
        if: always()
        run: |
          echo 'One focused native unit test gate. No full game run, Windows build or economic replay.' >> "$GITHUB_STEP_SUMMARY"
          echo 'SQLite table migrations unchanged; Director JSON receipt fields are optional for previous checkpoints.' >> "$GITHUB_STEP_SUMMARY"
