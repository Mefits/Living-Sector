name: P2 PR262 current HEAD boot and 500 paid ticks

on:
  push:
    branches:
      - integration/perf-astra-5-workers-20261116
    paths:
      - .github/workflows/p2-pr262-head-500-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-pr262-head-500-acceptance
  cancel-in-progress: true

jobs:
  current-head-short-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot-pr262"
          curl --fail --location --retry 2 --connect-timeout 15 \
            --max-time 150 --silent --show-error \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o "$RUNNER_TEMP/godot-pr262.zip"
          unzip -q -j "$RUNNER_TEMP/godot-pr262.zip" -d "$RUNNER_TEMP/godot-pr262"
          mv "$RUNNER_TEMP/godot-pr262/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot-pr262/godot"
          chmod +x "$RUNNER_TEMP/godot-pr262/godot"
          echo "$RUNNER_TEMP/godot-pr262" >> "$GITHUB_PATH"
      - name: Import and compile entire project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/logs/pr262-current-head
          timeout --signal=TERM --kill-after=5s 70s \
            godot --headless --path godot --editor --import --quit \
            >godot/logs/pr262-current-head/import.log 2>&1 || {
              tail -n 100 godot/logs/pr262-current-head/import.log; exit 1;
            }
          timeout --signal=TERM --kill-after=5s 70s \
            godot --headless --path godot \
            --script res://tests/p2_unified_script_compile_check.gd \
            >godot/logs/pr262-current-head/compile.log 2>&1 || {
              tail -n 100 godot/logs/pr262-current-head/compile.log; exit 1;
            }
          if grep -Eq 'SCRIPT ERROR:|Parse Error:' godot/logs/pr262-current-head/import.log godot/logs/pr262-current-head/compile.log; then
            tail -n 100 godot/logs/pr262-current-head/compile.log; exit 1;
          fi
          echo "P2_PR262_HEAD_COMPILE_PASS"
      - name: Actual WORKER GUI boot, two paid ticks, N38 save and restart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr262-head-worker-user"
          timeout --signal=TERM --kill-after=5s 65s \
            env XDG_DATA_HOME="$RUNNER_TEMP/pr262-head-worker-user" \
            godot --headless --path godot -- --p2-worker-gui-check \
            >godot/logs/pr262-current-head/gui-worker.log 2>&1 || {
              tail -n 120 godot/logs/pr262-current-head/gui-worker.log; exit 1;
            }
          grep -q P2_WORKER_GUI_BOOT_CHECK_PASS godot/logs/pr262-current-head/gui-worker.log || {
            tail -n 120 godot/logs/pr262-current-head/gui-worker.log; exit 1;
          }
          if grep -Eq 'SCRIPT ERROR:|Parse Error:' godot/logs/pr262-current-head/gui-worker.log; then
            tail -n 120 godot/logs/pr262-current-head/gui-worker.log; exit 1;
          fi
          grep P2_WORKER_GUI_BOOT_CHECK_PASS godot/logs/pr262-current-head/gui-worker.log
      - name: Strict 500 real paid ticks on current HEAD, not a synthetic skip
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 335s \
            godot --headless --path godot \
            --script res://tests/p2_perf_pr262_head_500_tick_smoke.gd \
            >godot/logs/pr262-current-head/paid500.log 2>&1 || {
              tail -n 140 godot/logs/pr262-current-head/paid500.log; exit 1;
            }
          grep -q P2_PR262_HEAD_500_TICK_PASS godot/logs/pr262-current-head/paid500.log || {
            tail -n 140 godot/logs/pr262-current-head/paid500.log; exit 1;
          }
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|P2_PR262_HEAD_500_TICK_FAIL' godot/logs/pr262-current-head/paid500.log; then
            tail -n 140 godot/logs/pr262-current-head/paid500.log; exit 1;
          fi
          grep P2_PR262_HEAD_500_TICK_ godot/logs/pr262-current-head/paid500.log
      - name: Targeted current A B C D E regressions, no long replay
        shell: bash
        run: |
          set -euo pipefail
          for t in \
            p2_perf_a_n18_staffing_owned_copy_20261116 \
            p2_perf_b_private_receipt_append_no_double_copy_check \
            p2_perf_pr262_head_c_occupancy_wrapper \
            p2_perf_d_n150_owned_order_compaction_20261116 \
            p2_perf_e_same_seed_checkpoint_comparator \
            p2_late_growth_weak_parent_check \
            p2_runtime_read_projection_check; do
            timeout --signal=TERM --kill-after=5s 25s \
              godot --headless --path godot --script "res://tests/$t.gd" \
              >"godot/logs/pr262-current-head/$t.log" 2>&1 || {
                echo "FAILED $t"; tail -n 110 "godot/logs/pr262-current-head/$t.log"; exit 1;
              }
            if grep -Eq 'SCRIPT ERROR:|Parse Error:|P2_.*FAIL' "godot/logs/pr262-current-head/$t.log"; then
              echo "FAILED $t"; tail -n 110 "godot/logs/pr262-current-head/$t.log"; exit 1;
            fi
            if test "$t" = "p2_perf_a_n18_staffing_owned_copy_20261116"; then
              # This existing A test is assertion-only and exits 0 silently.
              # CI ran it above with Godot debug assertions enabled.
              echo "P2_PR262_HEAD_A_N18_ASSERTIONS_PASS"
            else
              grep -q PASS "godot/logs/pr262-current-head/$t.log" || {
                echo "PASS marker missing: $t"; tail -n 110 "godot/logs/pr262-current-head/$t.log"; exit 1;
              }
              grep PASS "godot/logs/pr262-current-head/$t.log" | tail -n 2
            fi
          done
          echo "P2_PR262_HEAD_TARGETED_REGRESSIONS_PASS"
      - name: Same-seed Astra two-fix 160 paid tick checkpoint parity, bounded
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 170s \
            godot --headless --path godot \
            --script res://tests/p2_perf_pr262_astra_fixes_160_parity.gd \
            >godot/logs/pr262-current-head/astra-parity160.log 2>&1 || {
              tail -n 100 godot/logs/pr262-current-head/astra-parity160.log; exit 1;
            }
          grep -q P2_ASTRA_TWO_FIXES_160_PARITY_PASS godot/logs/pr262-current-head/astra-parity160.log || {
            tail -n 100 godot/logs/pr262-current-head/astra-parity160.log; exit 1;
          }
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|P2_ASTRA_TWO_FIXES_160_PARITY_FAIL' godot/logs/pr262-current-head/astra-parity160.log; then
            tail -n 100 godot/logs/pr262-current-head/astra-parity160.log; exit 1;
          fi
          grep P2_ASTRA_TWO_FIXES_160_PARITY_PASS godot/logs/pr262-current-head/astra-parity160.log

      - name: Upload short smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-pr262-current-head-500-logs
          path: godot/logs/pr262-current-head/
          if-no-files-found: warn
          retention-days: 7

# Recheck latest performance commits on 2026-11-16 (N39/N9/N21/N150).
# Morning PR262 HEAD acceptance recheck 2026-11-17 after five A-E optimization shifts.
