name: "Living Sector Genesis stable - PR42 + A2 + mining + Observer"
on:
  push:
    branches: [integration/genesis-pr42-final-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend-native:
    name: Station orbit and economy integration regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Observer data bindings, map and telemetry
        run: |
          node --check observer/app.js
          node --check observer/telemetry-ui.js
          node --check observer/telemetry-model.js
          node observer/build-strategy.mjs --check
          node observer/build-telemetry.mjs --check
          node --test observer/*.test.mjs tests/genesis-six-systems-preview.test.mjs tests/genesis-physical-orbits.test.mjs
      - name: Verify native mining and station orders
        run: |
          for filter in physical_orbit_tests station_order_ physical_ice_mining; do
            cargo test --locked -p sim_core -p sim_server -p sim_db --lib "$filter" --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
          done
  windows:
    name: Windows x64 native orbital world build and smoke
    runs-on: windows-2022
    timeout-minutes: 100
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify UI scripts and seed
        shell: pwsh
        run: |
          node --test observer/telemetry-model.test.mjs observer/station-admin-ui.test.mjs observer/station-economy.test.mjs observer/model.test.mjs tests/genesis-six-systems-preview.test.mjs tests/genesis-physical-orbits.test.mjs
          node observer/build-strategy.mjs --write
          node observer/build-telemetry.mjs --write
          node observer/build-strategy.mjs --check
          node observer/build-telemetry.mjs --check
      - name: Compile actual Genesis server
        shell: pwsh
        run: cargo build --locked --release -p sim_server --bin genesis_server
      - name: Live API and 16x smoke on isolated save
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $env:DATABASE_PATH=Join-Path (Get-Location) "physical-orbits-fresh-smoke.db"
          $env:DATA_DIR=(Resolve-Path "priv/genesis/data").Path
          $env:LIVING_SECTOR_UI_DIR=(Resolve-Path "observer").Path
          $env:BIND_ADDR="127.0.0.1:18097"
          $env:WORLD_SPEED="1.0"
          $env:LIVING_SECTOR_STRATEGY_MODE="execute"
          $proc=Start-Process -FilePath (Resolve-Path "target/release/genesis_server.exe").Path -PassThru
          try {
            $done=$false
            for($i=0;$i -lt 85;$i++){
              if($proc.HasExited){throw "Native server exited early: $($proc.ExitCode)"}
              try {
                $report=Invoke-RestMethod "http://127.0.0.1:18097/api/report" -TimeoutSec 3
                $systems=@($report.systems)
                if($systems.Count -ne 6){throw "Expected 6 systems, got $($systems.Count)"}
                if(@($report.factions).Count -ne 3){throw "Expected 3 factions"}
                if(@($report.facilities).Count -ne 12){throw "Expected 12 facilities with paid farms"}
                if(@($report.ships).Count -ne 3){throw "Expected 3 physical miners"}
                if(@($report.ships | Where-Object {$_.class -eq "miner"}).Count -ne 3){throw "Missing miner class"}
                $bodies=0;foreach($sys in $systems){$bodies+=@($sys.bodies).Count}
                if($bodies -ne 36){throw "Expected 36 original bodies"}
                $strategy=Invoke-RestMethod "http://127.0.0.1:18097/api/strategy" -TimeoutSec 5
                if($null -eq $strategy.stations -or $null -eq $strategy.orders){throw "Astra A1/A2 data missing"}
                $sol=$systems | Where-Object { $_.name -eq "Sol" } | Select-Object -First 1
                if($null -eq $sol){ throw "Sol not found after spatial merge" }
                foreach($path in @("observer","observer/app.js","observer/styles.css","observer/station-kit.js")){
                  $page=Invoke-WebRequest -Uri "http://127.0.0.1:18097/$path" -UseBasicParsing -TimeoutSec 5
                  if($page.StatusCode -ne 200){throw "Observer asset unavailable: $path"}
                }
                $body='{"world_speed":16,"ticks_per_second":16}'
                Invoke-RestMethod -Uri "http://127.0.0.1:18097/api/sim/speed" -Method Post -ContentType "application/json" -Body $body -TimeoutSec 5 | Out-Null
                Start-Sleep -Milliseconds 400
                $health=Invoke-RestMethod "http://127.0.0.1:18097/api/health" -TimeoutSec 5
                if([double]$health.world_speed -ne 16){throw "16x speed did not apply: $($health.world_speed)"}
                Invoke-RestMethod -Uri "http://127.0.0.1:18097/api/sim/pause" -Method Post -ContentType "application/json" -Body '{}' -TimeoutSec 5 | Out-Null
                Write-Host "PASS: 6 systems, 36 bodies, 12 facilities, 3 miners, orbit 2x seed tests, A1/A2, Observer and 16x"
                $done=$true
                break
              }catch{
                if($i -gt 20){throw}
                Start-Sleep -Seconds 1
              }
            }
            if(!$done){throw "Smoke timeout"}
          }finally{if(!$proc.HasExited){Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue}}
      - name: Create complete portable archive
        shell: pwsh
        run: |
          $root="dist/Living-Sector-Genesis-Stable-PR42"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Copy-Item "target/release/genesis_server.exe" "$root/Genesis-Server.exe"
          Copy-Item "Start-Genesis.cmd" "$root/Start-Genesis.cmd"
          Copy-Item "LICENSE" "$root/LICENSE"
          Copy-Item "observer" "$root/observer" -Recurse
          New-Item -ItemType Directory -Path "$root/priv/genesis" -Force | Out-Null
          Copy-Item "priv/genesis/data" "$root/priv/genesis/data" -Recurse
          @(
            "LIVING SECTOR - GENESIS STABLE PR42: PHYSICAL ORBITS + ASTRA A2 + MINING + V5.1",
            "",
            "1. Extract into a new folder and run Start-Genesis.cmd.",
            "2. Native Observer map, ships, planets, station-kit assets and the Astra strategy drawer remain intact.",
            "3. New live Statistics drawer: resources, production, population, markets, fleet and charts.",
            "4. Production now includes paid farms. Three miners harvest physical ice and sell through native paid markets.",
            "5. Speed menu includes 16x with 16 ticks/second.",
            "6. PR42: 2x physical planetary orbit distances, shared station orbits (period 8000), persisted SQLite phase and camera follow.",
            "7. Verified targeted orbit and A2/mining tests, Windows smoke. Long-run balance is still not proven; launch uses a new save name."
          ) | Set-Content "$root/README.txt" -Encoding UTF8
          Compress-Archive -Path $root -DestinationPath "dist/Living-Sector-A2-Mining-Telemetry-Windows.zip" -CompressionLevel Optimal -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Living-Sector-Genesis-Stable-PR42-Windows
          path: dist/Living-Sector-A2-Mining-Telemetry-Windows.zip
          retention-days: 14
          if-no-files-found: error
