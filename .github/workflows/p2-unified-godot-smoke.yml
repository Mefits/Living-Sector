name: Godot P2 unified smoke

on:
  push:
    branches:
      - integration/godot-phase2-unified-20261113
      - feature/n84-ship-only-copy-20261115
      - feature/godot-phase2-world-copy-boundaries-20261115
      - feature/n9-owned-ledger-fork-20261115
      - feature/n153-route-graph-cache-20261115
      - feature/n9-sharded-append-only-journal-20261115
    paths:
      - .github/workflows/p2-unified-godot-smoke.yml
      - godot/docs/phase2/P2_CI_TRIGGER.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-real-godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check source preloads
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path("godot")
          missing = []
          scripts = list((root/"scripts").rglob("*.gd"))
          for path in scripts:
              text = path.read_text(encoding="utf-8-sig")
              for ref in re.findall(r'preload\("res://([^"]+)"\)', text):
                  if not (root/ref).is_file():
                      missing.append(f"{path}: {ref}")
          print(f"Static preloads: {len(scripts)} scripts, missing={len(missing)}")
          for problem in missing:
              print("MISSING_PRELOAD", problem)
          sys.exit(1 if missing else 0)
          PY
      - name: Install original project Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q -j "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: One actual Godot parser and simulation smoke
        id: smoke
        shell: bash
        run: |
          set +e
          mkdir -p godot/logs/p2-unified
          godot --version | tee godot/logs/p2-unified/version.txt
          timeout --signal=TERM --kill-after=5s 75s godot --headless --path godot --editor --import --quit \
            > godot/logs/p2-unified/editor-import.log 2>&1
          editor=$?
          timeout --signal=TERM --kill-after=5s 75s godot --headless --path godot \
            --script res://tests/p2_unified_script_compile_check.gd \
            > godot/logs/p2-unified/compile-all.log 2>&1
          parse=$?
          if test "$editor" -ne 0 -o "$parse" -ne 0; then
            echo "P2_CI_PARSE_FAIL editor=$editor parse=$parse"
            tail -n 100 godot/logs/p2-unified/compile-all.log
            exit 1
          fi
          timeout --signal=TERM --kill-after=5s 75s godot --headless --path godot \
            --script res://tests/p2_n158_live_production_check.gd \
            > godot/logs/p2-unified/n158-paid-production.log 2>&1
          economy=$?
          # N140 must preserve native N84/N146 decisions, source World
          # and sleeping ships while avoiding one full ledger/history copy.
          timeout --signal=TERM --kill-after=5s 30s godot --headless --path godot \
            --script res://tests/p2_n140_source_copy_equivalence_check.gd \
            > godot/logs/p2-unified/n140-copy-parity.log 2>&1
          n140=$?
          if test "$n140" -ne 0; then
            echo "P2_CI_N140_COPY_PARITY_FAIL code=$n140"
            tail -n 100 godot/logs/p2-unified/n140-copy-parity.log
            exit 1
          fi
          # Only normalize exact N21 receipt integers on N38 reload;
          # fractional or forged text fees must remain refused.
          timeout --signal=TERM --kill-after=5s 30s godot --headless --path godot \
            --script res://tests/p2_n38_n21_paid_fee_type_roundtrip_check.gd \
            > godot/logs/p2-unified/n38-n21-fee-codec.log 2>&1
          n21codec=$?
          if test "$n21codec" -ne 0; then
            echo "P2_CI_N21_FEE_CODEC_FAIL code=$n21codec"
            tail -n 100 godot/logs/p2-unified/n38-n21-fee-codec.log
            exit 1
          fi
          # N39 ship-domain stages must not clone all unrelated World
          # history and must keep source N9 wallets and proposal isolation.
          timeout --signal=TERM --kill-after=5s 45s godot --headless --path godot \
            --script res://tests/p2_n39_ship_domain_copy_boundary_check.gd \
            > godot/logs/p2-unified/n39-ship-copy-boundary.log 2>&1
          n39cow=$?
          if test "$n39cow" -ne 0; then
            echo "P2_CI_N39_SHIP_COW_FAIL code=$n39cow"
            tail -n 100 godot/logs/p2-unified/n39-ship-copy-boundary.log
            exit 1
          fi
          # A trusted staged N9 fork may only modify its OWN detached
          # ledger, and old immutable receipt history must still be checked.
          timeout --signal=TERM --kill-after=5s 35s godot --headless --path godot \
            --script res://tests/p2_n9_owned_fork_history_check.gd \
            > godot/logs/p2-unified/n9-owned-fork-history.log 2>&1
          n9fork=$?
          if test "$n9fork" -ne 0; then
            echo "P2_CI_N9_FORK_FAIL code=$n9fork"
            tail -n 110 godot/logs/p2-unified/n9-owned-fork-history.log
            exit 1
          fi
          # Cached N4 route results must preserve direction/tie breaks and
          # actual N153 funded-contract decisions, including N38 reload.
          timeout --signal=TERM --kill-after=5s 30s godot --headless --path godot \
            --script res://tests/p2_n153_route_cache_parity_check.gd \
            > godot/logs/p2-unified/n153-route-cache-parity.log 2>&1
          n153route=$?
          if test "$n153route" -ne 0; then
            echo "P2_CI_N153_ROUTE_PARITY_FAIL code=$n153route"
            tail -n 100 godot/logs/p2-unified/n153-route-cache-parity.log
            exit 1
          fi
          timeout --signal=TERM --kill-after=5s 30s godot --headless --path godot \
            --script res://tests/n58_route_graph_audit_check.gd \
            > godot/logs/p2-unified/n58-route-audit.log 2>&1
          n58=$?
          if test "$n58" -ne 0; then
            echo "P2_CI_N58_ROUTE_AUDIT_FAIL code=$n58"
            tail -n 100 godot/logs/p2-unified/n58-route-audit.log
            exit 1
          fi
          timeout --signal=TERM --kill-after=5s 75s godot --headless --path godot \
            --script res://tests/p2_n153_live_contract_dispatch_check.gd \
            > godot/logs/p2-unified/n153-real-dispatch.log 2>&1
          n153actual=$?
          if test "$n153actual" -ne 0; then
            echo "P2_CI_N153_REAL_DISPATCH_FAIL code=$n153actual"
            tail -n 110 godot/logs/p2-unified/n153-real-dispatch.log
            exit 1
          fi
          # II-A N9 immutable partitioned receipt archive and original
          # N38 insertion-order compatibility; reject replay or any
          # alias leak across paid ledgers.
          timeout --signal=TERM --kill-after=5s 55s godot --headless --path godot \
            --script res://tests/p2_n9_append_only_journal_check.gd \
            > godot/logs/p2-unified/n9-append-only-check.log 2>&1
          n9append=$?
          if test "$n9append" -ne 0; then
            echo "P2_CI_N9_APPEND_ONLY_FAIL code=$n9append"
            tail -n 130 godot/logs/p2-unified/n9-append-only-check.log
            exit 1
          fi
          # N21 must reject loss or rewrite of old paid N9 receipts while
          # avoiding quadratic history cloning on every docking action.
          timeout --signal=TERM --kill-after=5s 45s godot --headless --path godot \
            --script res://tests/p2_n21_ledger_history_guard_check.gd \
            > godot/logs/p2-unified/n21-history-guard.log 2>&1
          n21history=$?
          if test "$n21history" -ne 0; then
            echo "P2_CI_N21_LEDGER_HISTORY_FAIL code=$n21history"
            tail -n 100 godot/logs/p2-unified/n21-history-guard.log
            exit 1
          fi
          # Source Rust market and producer projections share exactly
          # one N9 FacilityOperations wallet. N129 relief must never
          # overwrite its newly paid balance with a stale alias view.
          timeout --signal=TERM --kill-after=5s 35s godot --headless --path godot \
            --script res://tests/p2_n129_shared_facility_wallet_check.gd \
            > godot/logs/p2-unified/n129-shared-wallet.log 2>&1
          n129=$?
          if test "$n129" -ne 0; then
            echo "P2_CI_N129_SHARED_WALLET_FAIL code=$n129"
            tail -n 100 godot/logs/p2-unified/n129-shared-wallet.log
            exit 1
          fi
          # One read-only N38 checkpoint must serve the GUI's economy,
          # fleet and summary without mutating authoritative N39 data.
          timeout --signal=TERM --kill-after=5s 35s godot --headless --path godot \
            --script res://tests/p2_observer_checkpoint_projection_check.gd \
            > godot/logs/p2-unified/observer-projection.log 2>&1
          observer=$?
          if test "$observer" -ne 0; then
            echo "P2_CI_OBSERVER_PROJECTION_FAIL code=$observer"
            tail -n 100 godot/logs/p2-unified/observer-projection.log
            exit 1
          fi
          # ONE Gate4 research acceptance on the original frozen Rust
          # factions, accounts, market electronics and actual N38 disk.
          timeout --signal=TERM --kill-after=5s 75s godot --headless --path godot \
            --script res://tests/p2_gate4_native_paid_research_check.gd \
            > godot/logs/p2-unified/n143-paid-research.log 2>&1
          research=$?
          if test "$economy" -ne 0 -o "$research" -ne 0; then
            echo "P2_CI_BASE_SMOKE_FAIL economy=$economy research=$research"
            tail -n 80 godot/logs/p2-unified/n158-paid-production.log
            tail -n 80 godot/logs/p2-unified/n143-paid-research.log
            exit 1
          fi
          # Source N151 prepares a real temporary construction dock BEFORE
          # a colony has its own Market. N91 must not reject that native
          # phase, or accept an unreceipted/foreign dock or unpaid site.
          timeout --signal=TERM --kill-after=5s 45s godot --headless --path godot \
            --script res://tests/p2_n91_marketless_colony_dock_stage_check.gd \
            > godot/logs/p2-unified/n91-colony-dock.log 2>&1
          n91=$?
          # Check exact binary representation of native market float values
          # inside the existing authenticated JSON N38 envelope, and
          # backward-compatible loading of old plain numeric v1 payloads.
          timeout --signal=TERM --kill-after=5s 45s godot --headless --path godot \
            --script res://tests/p2_n38_native_f64_envelope_check.gd \
            > godot/logs/p2-unified/n38-exact-f64.log 2>&1
          n38=$?
          if test "$n91" -ne 0 -o "$n38" -ne 0; then
            echo "P2_CI_N91_N38_FAST_FAIL n91=$n91 n38=$n38"
            tail -n 80 godot/logs/p2-unified/n91-colony-dock.log
            tail -n 80 godot/logs/p2-unified/n38-exact-f64.log
            exit 1
          fi
          # Stage2 once per source checkpoint: original clean Galaxy,
          # real faction cycles and N38 restart at tick 360, through 361.
          # No seeded contracts, player orders, balance or World rewrites.
          # On the dedicated performance branch continue the same real
          # N38 restart + paid source acceptance past the N129 tick825
          # regression, without altering the default integration gate.
          if test "$GITHUB_REF_NAME" = "feature/n9-sharded-append-only-journal-20261115"; then
            # Original seed, unmodified production economy, full N38
            # save/restart at tick360, strict N21 and N129 paid proofs.
            LS_STAGE2_LONG_TICKS=900 LS_PROFILE_NATIVE_PHASES=1 \
              timeout --signal=TERM --kill-after=5s 420s godot --headless --path godot \
                --script res://tests/p2_stage2_clean_seed_420_tick_acceptance.gd \
                > godot/logs/p2-unified/stage2-native-420.log 2>&1
            stage2=$?
            if test "$stage2" -ne 0 || ! grep -q "P2_STAGE2_LONG_NATIVE_PASS tick=900" godot/logs/p2-unified/stage2-native-420.log; then
              echo "P2_CI_N9_APPEND_900_FAIL code=$stage2"
              tail -n 110 godot/logs/p2-unified/stage2-native-420.log
              exit 1
            fi
            # Paired same-host benchmark. Baseline is the approved
            # integration HEAD immediately before this PR. Only swap
            # the N9 implementation; workload and Godot binary identical.
            ledger_file=godot/scripts/sim/economy/credit_ledger.gd
            cp "$ledger_file" "$RUNNER_TEMP/n9-append-candidate.gd"
            git fetch --no-tags --depth=1 origin 814a72eb945bfd53e2018f62e71fa7981adc2d9f
            git show 814a72eb945bfd53e2018f62e71fa7981adc2d9f:"$ledger_file" > "$ledger_file"
            timeout --signal=TERM --kill-after=5s 120s godot --headless --path godot \
              --script res://tests/p2_n9_fork_scaling_benchmark.gd \
              > godot/logs/p2-unified/n9-append-base-scale.log 2>&1
            base_code=$?
            cp "$RUNNER_TEMP/n9-append-candidate.gd" "$ledger_file"
            timeout --signal=TERM --kill-after=5s 120s godot --headless --path godot \
              --script res://tests/p2_n9_fork_scaling_benchmark.gd \
              > godot/logs/p2-unified/n9-append-candidate-scale.log 2>&1
            cand_code=$?
            echo "N9_APPEND_ONLY_AB_BASELINE"
            grep 'N9_FORK_SCALE_RESULT' godot/logs/p2-unified/n9-append-base-scale.log
            echo "N9_APPEND_ONLY_AB_CANDIDATE"
            grep 'N9_FORK_SCALE_RESULT' godot/logs/p2-unified/n9-append-candidate-scale.log
            test "$base_code" -eq 0 -a "$cand_code" -eq 0 || exit 1
            # The fast fork must not make whole World/N38 simulation slower:
            # exact same 420 ticks, native source seed + real N38 restart.
            # Compare every published acceptance checkpoint after removing
            # the wall-clock-only field. Both arms run on ONE CI host.
            git show 814a72eb945bfd53e2018f62e71fa7981adc2d9f:"$ledger_file" > "$ledger_file"
            timeout --signal=TERM --kill-after=5s 240s godot --headless --path godot \
              --script res://tests/p2_stage2_clean_seed_420_tick_acceptance.gd \
              > godot/logs/p2-unified/n9-append-base-420.log 2>&1
            world_base=$?
            cp "$RUNNER_TEMP/n9-append-candidate.gd" "$ledger_file"
            timeout --signal=TERM --kill-after=5s 240s godot --headless --path godot \
              --script res://tests/p2_stage2_clean_seed_420_tick_acceptance.gd \
              > godot/logs/p2-unified/n9-append-candidate-420.log 2>&1
            world_candidate=$?
            base_ms=$(grep -o 'P2_STAGE2_CLEAN_NATIVE_TICK420_N38_RESTART_PASS elapsed_ms=[0-9]*' godot/logs/p2-unified/n9-append-base-420.log | tail -n 1 | sed 's/.*=//')
            candidate_ms=$(grep -o 'P2_STAGE2_CLEAN_NATIVE_TICK420_N38_RESTART_PASS elapsed_ms=[0-9]*' godot/logs/p2-unified/n9-append-candidate-420.log | tail -n 1 | sed 's/.*=//')
            grep 'P2_STAGE2_CLEAN_CHECK tick=' godot/logs/p2-unified/n9-append-base-420.log | sed -E 's/ elapsed_ms=[0-9]+//' > godot/logs/p2-unified/n9-append-base-checkpoints.txt
            grep 'P2_STAGE2_CLEAN_CHECK tick=' godot/logs/p2-unified/n9-append-candidate-420.log | sed -E 's/ elapsed_ms=[0-9]+//' > godot/logs/p2-unified/n9-append-candidate-checkpoints.txt
            diff -u godot/logs/p2-unified/n9-append-base-checkpoints.txt godot/logs/p2-unified/n9-append-candidate-checkpoints.txt
            echo "N9_JOURNAL_WHOLE_SIM_AB_PASS baseline_ms=${base_ms:-MISSING} candidate_ms=${candidate_ms:-MISSING} checkpoints_identical=true"
            test "$world_base" -eq 0 -a "$world_candidate" -eq 0 -a -n "$base_ms" -a -n "$candidate_ms" || exit 1
          elif test "$GITHUB_REF_NAME" = "feature/n153-route-graph-cache-20261115"; then
            LS_STAGE2_LONG_TICKS=900 LS_PROFILE_NATIVE_PHASES=1 \
              timeout --signal=TERM --kill-after=5s 420s godot --headless --path godot \
                --script res://tests/p2_stage2_clean_seed_420_tick_acceptance.gd \
                > godot/logs/p2-unified/stage2-native-420.log 2>&1
            stage2=$?
            if test "$stage2" -ne 0 || ! grep -q "P2_STAGE2_LONG_NATIVE_PASS tick=900" godot/logs/p2-unified/stage2-native-420.log; then
              echo "P2_CI_N153_LONG_900_FAIL code=$stage2"
              tail -n 100 godot/logs/p2-unified/stage2-native-420.log
              exit 1
            fi
            routefile=godot/scripts/sim/route_graph.gd
            cp "$routefile" "$RUNNER_TEMP/n153-route-candidate.gd"
            git fetch --no-tags --depth=1 origin e1dc28924cd689edd23d8a75b273c63678199f31
            git show e1dc28924cd689edd23d8a75b273c63678199f31:"$routefile" > "$routefile"
            timeout --signal=TERM --kill-after=5s 90s godot --headless --path godot \
              --script res://tests/p2_n153_route_cache_benchmark.gd \
              > godot/logs/p2-unified/n153-route-baseline-bench.log 2>&1
            baseline_code=$?
            cp "$RUNNER_TEMP/n153-route-candidate.gd" "$routefile"
            timeout --signal=TERM --kill-after=5s 90s godot --headless --path godot \
              --script res://tests/p2_n153_route_cache_benchmark.gd \
              > godot/logs/p2-unified/n153-route-candidate-bench.log 2>&1
            candidate_code=$?
            echo "N153_ROUTE_AB_BASELINE $(grep 'N153_ROUTE_REPEAT_BENCH_PASS' godot/logs/p2-unified/n153-route-baseline-bench.log | tail -n 1)"
            echo "N153_ROUTE_AB_CANDIDATE $(grep 'N153_ROUTE_REPEAT_BENCH_PASS' godot/logs/p2-unified/n153-route-candidate-bench.log | tail -n 1)"
            test "$baseline_code" -eq 0 -a "$candidate_code" -eq 0 || exit 1
          elif test "$GITHUB_REF_NAME" = "feature/n9-owned-ledger-fork-20261115"; then
            # New ledger branch is first proven on the real 900-tick
            # original seed including strict N38 restart at tick360.
            LS_STAGE2_LONG_TICKS=900 LS_PROFILE_NATIVE_PHASES=1 \
              timeout --signal=TERM --kill-after=5s 420s godot --headless --path godot \
                --script res://tests/p2_stage2_clean_seed_420_tick_acceptance.gd \
                > godot/logs/p2-unified/stage2-native-420.log 2>&1
            stage2=$?
            if test "$stage2" -ne 0 || ! grep -q "P2_STAGE2_LONG_NATIVE_PASS tick=900" godot/logs/p2-unified/stage2-native-420.log; then
              echo "P2_CI_N9_LONG_900_FAIL code=$stage2"
              tail -n 100 godot/logs/p2-unified/stage2-native-420.log
              exit 1
            fi
            # Source vs candidate on one CI machine / Godot binary.
            # Only these two changed source files are reverted to the
            # already accepted base commit for the source arm.
            base_sha=f577c1c64e65e5d96fddd8f72d691020e1bd3dff
            src_ledger=godot/scripts/sim/economy/credit_ledger.gd
            src_world=godot/scripts/sim/phase1/n39_native_world_production.gd
            cp "$src_ledger" "$RUNNER_TEMP/n9-candidate-ledger.gd"
            cp "$src_world" "$RUNNER_TEMP/n9-candidate-world.gd"
            git fetch --no-tags --depth=1 origin "$base_sha"
            git show "$base_sha:$src_ledger" > "$src_ledger"
            git show "$base_sha:$src_world" > "$src_world"
            timeout --signal=TERM --kill-after=5s 300s godot --headless --path godot \
              --script res://tests/p2_stage2_clean_seed_420_tick_acceptance.gd \
              > godot/logs/p2-unified/n9-ab-baseline.log 2>&1
            baseline_code=$?
            cp "$RUNNER_TEMP/n9-candidate-ledger.gd" "$src_ledger"
            cp "$RUNNER_TEMP/n9-candidate-world.gd" "$src_world"
            timeout --signal=TERM --kill-after=5s 300s godot --headless --path godot \
              --script res://tests/p2_stage2_clean_seed_420_tick_acceptance.gd \
              > godot/logs/p2-unified/n9-ab-candidate.log 2>&1
            candidate_code=$?
            base_ms=$(grep -o 'P2_STAGE2_CLEAN_NATIVE_TICK420_N38_RESTART_PASS elapsed_ms=[0-9]*' godot/logs/p2-unified/n9-ab-baseline.log | tail -n 1 | sed 's/.*=//')
            candidate_ms=$(grep -o 'P2_STAGE2_CLEAN_NATIVE_TICK420_N38_RESTART_PASS elapsed_ms=[0-9]*' godot/logs/p2-unified/n9-ab-candidate.log | tail -n 1 | sed 's/.*=//')
            echo "N9_OWNED_FORK_AB_RESULT baseline_ms=${base_ms:-MISSING} candidate_ms=${candidate_ms:-MISSING}"
            test "$baseline_code" -eq 0 -a "$candidate_code" -eq 0 -a -n "$base_ms" -a -n "$candidate_ms" || exit 1
          elif test "$GITHUB_REF_NAME" = "feature/n84-ship-only-copy-20261115" || \
                  test "$GITHUB_REF_NAME" = "feature/godot-phase2-world-copy-boundaries-20261115"; then
            LS_STAGE2_LONG_TICKS=900 LS_PROFILE_NATIVE_PHASES=1 \
              timeout --signal=TERM --kill-after=5s 420s godot --headless --path godot \
                --script res://tests/p2_stage2_clean_seed_420_tick_acceptance.gd \
                > godot/logs/p2-unified/stage2-native-420.log 2>&1
            stage2=$?
            if ! grep -q "P2_STAGE2_LONG_NATIVE_PASS tick=900" godot/logs/p2-unified/stage2-native-420.log; then
              echo "P2_CI_LONG_900_NOT_PROVED"
              stage2=99
            fi
          else
            timeout --signal=TERM --kill-after=5s 300s godot --headless --path godot \
              --script res://tests/p2_stage2_clean_seed_420_tick_acceptance.gd \
              > godot/logs/p2-unified/stage2-native-420.log 2>&1
            stage2=$?
          fi
          echo "P2_CI_RESULT editor=$editor parse=$parse economy=$economy research=$research stage2=$stage2 n91=$n91 n38=$n38"
          for file in godot/logs/p2-unified/*.log; do
            echo "::group::$file"
            tail -n 90 "$file"
            echo "::endgroup::"
          done
          test "$editor" -eq 0 -a "$parse" -eq 0 -a "$economy" -eq 0 -a "$research" -eq 0 -a "$stage2" -eq 0 -a "$n91" -eq 0 -a "$n38" -eq 0
      - name: Save diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-p2-unified-diagnostics
          path: godot/logs/p2-unified/
          if-no-files-found: warn
