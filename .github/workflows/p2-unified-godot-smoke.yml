name: Godot P2 unified smoke

on:
  push:
    branches:
      - integration/godot-phase2-unified-20261113
    paths:
      - .github/workflows/p2-unified-godot-smoke.yml
      - godot/docs/phase2/P2_CI_TRIGGER.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-real-godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Check source preloads
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path("godot")
          missing = []
          scripts = list((root/"scripts").rglob("*.gd"))
          for path in scripts:
              text = path.read_text(encoding="utf-8-sig")
              for ref in re.findall(r'preload\("res://([^"]+)"\)', text):
                  if not (root/ref).is_file():
                      missing.append(f"{path}: {ref}")
          print(f"Static preloads: {len(scripts)} scripts, missing={len(missing)}")
          for problem in missing:
              print("MISSING_PRELOAD", problem)
          sys.exit(1 if missing else 0)
          PY
      - name: Install original project Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q -j "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: One actual Godot parser and simulation smoke
        id: smoke
        shell: bash
        run: |
          set +e
          mkdir -p godot/logs/p2-unified
          godot --version | tee godot/logs/p2-unified/version.txt
          godot --headless --path godot --editor --import --quit \
            > godot/logs/p2-unified/editor-import.log 2>&1
          editor=$?
          godot --headless --path godot \
            --script res://tests/p2_unified_script_compile_check.gd \
            > godot/logs/p2-unified/compile-all.log 2>&1
          parse=$?
          godot --headless --path godot \
            --script res://tests/p2_n158_live_production_check.gd \
            > godot/logs/p2-unified/n158-paid-production.log 2>&1
          economy=$?
          echo "P2_CI_RESULT editor=$editor parse=$parse economy=$economy"
          for file in godot/logs/p2-unified/*.log; do
            echo "::group::$file"
            tail -n 90 "$file"
            echo "::endgroup::"
          done
          test "$editor" -eq 0 -a "$parse" -eq 0 -a "$economy" -eq 0
      - name: Save diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-p2-unified-diagnostics
          path: godot/logs/p2-unified/
          if-no-files-found: warn
