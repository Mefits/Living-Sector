name: P2 PERF E bounded late-tick real hotpath slope

on:
  push:
    branches:
      - integration/perf-astra-5-workers-20261116
    paths:
      - .github/workflows/p2-perf-e-late-hotpath.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-perf-e-late-hotpath
  cancel-in-progress: true

jobs:
  real-source-late-ticks:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install project Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 150 --silent --show-error \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q -j "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import and script compile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/logs/perf-e-late
          timeout --signal=TERM --kill-after=5s 80s godot --headless --path godot --editor --import --quit \
            > godot/logs/perf-e-late/import.log 2>&1 || {
              tail -n 110 godot/logs/perf-e-late/import.log; exit 1;
            }
          timeout --signal=TERM --kill-after=5s 80s godot --headless --path godot \
            --script res://tests/p2_unified_script_compile_check.gd \
            > godot/logs/perf-e-late/compile.log 2>&1 || {
              tail -n 120 godot/logs/perf-e-late/compile.log; exit 1;
            }
      - name: Up to 2600 paid source ticks, cap 8 min, per-window hotpaths
        shell: bash
        run: |
          set -euo pipefail
          LS_PROFILE_NATIVE_PHASES=1 timeout --signal=TERM --kill-after=5s 530s \
            godot --headless --path godot \
            --script res://tests/p2_perf_e_late_tick_bounded_hotpath_probe.gd \
            > godot/logs/perf-e-late/late.log 2>&1 || {
              tail -n 140 godot/logs/perf-e-late/late.log; exit 1;
            }
          grep -q P2_PERF_E_LATE_TICK_BOUNDED_PASS godot/logs/perf-e-late/late.log || {
            tail -n 140 godot/logs/perf-e-late/late.log; exit 1;
          }
          grep P2_PERF_E_LATE_TICK_WINDOW godot/logs/perf-e-late/late.log
      - name: Preserve phase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-perf-e-late-hotpath-windows
          path: godot/logs/perf-e-late/
          if-no-files-found: warn
          retention-days: 7
