name: SystemBalance Colony Roads Short Parse
on:
  push:
    branches:
      - feature/SystemBalance-colony-roads-20261117
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parse:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot/bin"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 150 --silent --show-error \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q -j "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot/bin"
          mv "$RUNNER_TEMP/godot/bin/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot/bin/godot"
          chmod +x "$RUNNER_TEMP/godot/bin/godot"
          echo "$RUNNER_TEMP/godot/bin" >> "$GITHUB_PATH"
      - name: Import Godot project without missing script errors
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path godot --editor --import --quit > import.log 2>&1
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Could not resolve script' import.log; then
            tail -n 120 import.log
            exit 1
          fi
      - name: Check adapted SystemBalance roads and complete UI preloads
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path godot --script res://tests/p2_system_balance_colony_roads_check.gd > test.log 2>&1
          tail -n 80 test.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Could not resolve script|Assertion failed' test.log
          grep -q 'SYSTEM_BALANCE_COLONY_ROADS_PASS' test.log
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-balance-colony-short-logs
          path: |
            import.log
            test.log
          if-no-files-found: ignore
          retention-days: 4
