name: N9 persistent journal controlled whole-sim A-B

on:
  push:
    branches:
      - feature/n9-sharded-append-only-journal-20261115
    paths:
      - .github/workflows/p2-n9-journal-simulation-ab.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-source-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 (same binary for both arms)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q -j "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Original source 420-tick baseline versus N9 journal candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/logs/n9-ab
          timeout --signal=TERM --kill-after=5s 75s godot --headless --path godot --editor --import --quit \
            > godot/logs/n9-ab/import.log 2>&1
          ledger=godot/scripts/sim/economy/credit_ledger.gd
          cp "$ledger" "$RUNNER_TEMP/n9-journal-candidate.gd"
          base=814a72eb945bfd53e2018f62e71fa7981adc2d9f
          git fetch --no-tags --depth=1 origin "$base"
          git show "$base:$ledger" > "$ledger"
          timeout --signal=TERM --kill-after=5s 240s godot --headless --path godot \
            --script res://tests/p2_stage2_clean_seed_420_tick_acceptance.gd \
            > godot/logs/n9-ab/baseline-420.log 2>&1 || {
              tail -n 100 godot/logs/n9-ab/baseline-420.log
              exit 1
            }
          cp "$RUNNER_TEMP/n9-journal-candidate.gd" "$ledger"
          timeout --signal=TERM --kill-after=5s 240s godot --headless --path godot \
            --script res://tests/p2_stage2_clean_seed_420_tick_acceptance.gd \
            > godot/logs/n9-ab/candidate-420.log 2>&1 || {
              tail -n 100 godot/logs/n9-ab/candidate-420.log
              exit 1
            }
          base_ms=$(grep -o 'P2_STAGE2_CLEAN_NATIVE_TICK420_N38_RESTART_PASS elapsed_ms=[0-9]*' godot/logs/n9-ab/baseline-420.log | tail -n 1 | sed 's/.*=//')
          candidate_ms=$(grep -o 'P2_STAGE2_CLEAN_NATIVE_TICK420_N38_RESTART_PASS elapsed_ms=[0-9]*' godot/logs/n9-ab/candidate-420.log | tail -n 1 | sed 's/.*=//')
          test -n "$base_ms" -a -n "$candidate_ms"
          grep 'P2_STAGE2_CLEAN_CHECK tick=' godot/logs/n9-ab/baseline-420.log |
            sed -E 's/ elapsed_ms=[0-9]+//' > godot/logs/n9-ab/baseline-checkpoints.txt
          grep 'P2_STAGE2_CLEAN_CHECK tick=' godot/logs/n9-ab/candidate-420.log |
            sed -E 's/ elapsed_ms=[0-9]+//' > godot/logs/n9-ab/candidate-checkpoints.txt
          diff -u godot/logs/n9-ab/baseline-checkpoints.txt godot/logs/n9-ab/candidate-checkpoints.txt
          echo "N9_JOURNAL_WHOLE_SIM_AB_PASS baseline_ms=$base_ms candidate_ms=$candidate_ms checkpoints_identical=true"
      - name: Save A-B logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n9-journal-whole-sim-ab
          path: godot/logs/n9-ab/
          if-no-files-found: warn
