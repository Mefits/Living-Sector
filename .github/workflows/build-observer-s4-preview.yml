name: Temporary S4 Observer Windows preview
on:
  push:
    branches: [build/observer-s4-preview-20261106]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild generated UI in checkout only
        run: |
          node observer/build-strategy.mjs --write
          node --check observer/app.js
          node --check observer/strategy-ui.js
          node --test observer/model.test.mjs observer/strategy-model.test.mjs
  windows:
    needs: ui
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate Observer assets
        shell: pwsh
        run: |
          node observer/build-strategy.mjs --write
          node --test observer/model.test.mjs observer/strategy-model.test.mjs
      - name: Build full S4 Windows Genesis server
        shell: pwsh
        run: cargo build --locked --release -p sim_server --bin genesis_server
      - name: Test full server and updated Observer on isolated database
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:DATABASE_PATH=Join-Path (Get-Location) 's4-preview-ci-test.db'
          $env:DATA_DIR=(Resolve-Path 'priv/genesis/data').Path
          $env:LIVING_SECTOR_UI_DIR=(Resolve-Path 'observer').Path
          $env:BIND_ADDR='127.0.0.1:18096'
          $env:LIVING_SECTOR_STRATEGY_MODE='execute'
          $env:WORLD_SPEED='4.0'
          $p=Start-Process -FilePath (Resolve-Path 'target/release/genesis_server.exe').Path -PassThru
          try {
            $api=$null
            for($i=0;$i -lt 100;$i++) {
              if($p.HasExited) { throw 'Genesis server exited early' }
              try {
                $api=Invoke-RestMethod 'http://127.0.0.1:18096/api/strategy' -TimeoutSec 2
                if($api.schema_version -eq 1 -and @($api.factions).Count -eq 2) {break}
              } catch {}
              Start-Sleep -Seconds 1
            }
            if($null -eq $api -or @($api.factions).Count -ne 2 -or $api.mode -ne 'execute') {
              throw 'S4 API missing two factions or execute mode'
            }
            $fields=@($api.factions[0].PSObject.Properties.Name)
            foreach($key in @('head','construction','assessments','projects')) {
              if($fields -notcontains $key) {throw "S4 strategy field missing: $key"}
            }
            $page=Invoke-WebRequest 'http://127.0.0.1:18096/observer' -UseBasicParsing -TimeoutSec 5
            $script=Invoke-WebRequest 'http://127.0.0.1:18096/observer/app.js' -UseBasicParsing -TimeoutSec 5
            if($page.StatusCode -ne 200 -or $page.Content -notmatch 'strategy-head' -or
                $page.Content -notmatch 'strategy-construction' -or
                $page.Content -notmatch 'export-diagnostics' -or
                $script.StatusCode -ne 200 -or $script.Content -notmatch 'strategyRenderHead') {
              throw 'S2-S4 Observer not served'
            }
            Write-Host 'PASS: native S4 server, execute, 2 factions, strategy fields, head and construction UI, diagnostics button'
          } finally {
            if(-not $p.HasExited) {Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
            Remove-Item 's4-preview-ci-test.db*' -Force -ErrorAction SilentlyContinue
          }
      - name: Package one-click S4 Windows preview
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $folder='dist/Living-Sector-S4-Preview'
          New-Item -Path $folder -ItemType Directory -Force | Out-Null
          New-Item -Path "$folder/observer" -ItemType Directory -Force | Out-Null
          Copy-Item 'target/release/genesis_server.exe' "$folder/Genesis-Server.exe"
          Copy-Item 'priv/genesis/data' "$folder/data" -Recurse
          Copy-Item 'observer/index.html','observer/styles.css','observer/model.js','observer/app.js' "$folder/observer/"
          Copy-Item 'LICENSE' "$folder/LICENSE"
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          if not exist "Genesis-Server.exe" ( echo Missing Genesis-Server.exe & pause & exit /b 1 )
          if not exist "data\factions.json" ( echo Missing data files & pause & exit /b 1 )
          powershell -NoProfile -ExecutionPolicy Bypass -Command "try { Invoke-WebRequest 'http://127.0.0.1:8080/api/health' -UseBasicParsing -TimeoutSec 2 | Out-Null; exit 0 } catch { exit 1 }"
          if not errorlevel 1 ( echo Port 8080 occupied. Stop the other Living Sector first. & pause & exit /b 1 )
          set "BIND_ADDR=127.0.0.1:8080"
          set "DATA_DIR=%~dp0data"
          set "DATABASE_PATH=%~dp0living-sector-s4-preview-test.db"
          set "LIVING_SECTOR_UI_DIR=%~dp0observer"
          set "WORLD_SPEED=4.0"
          set "LIVING_SECTOR_STRATEGY_MODE=execute"
          echo Starting Living Sector S4 -- EXECUTE, speed x4, isolated TEST save.
          echo Close simulation console with Ctrl+C before deleting or moving files.
          start "Living Sector - S4" /D "%~dp0" "%~dp0Genesis-Server.exe"
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$ok=$false; for($i=0;$i -lt 80;$i++){try{$r=Invoke-WebRequest 'http://127.0.0.1:8080/api/health' -UseBasicParsing -TimeoutSec 2; if($r.StatusCode -eq 200){$ok=$true;break}}catch{};Start-Sleep -Seconds 1}; if($ok){Start-Process 'http://127.0.0.1:8080/observer'}else{Write-Host 'Server not responding; check simulation console.';exit 1}"
          if errorlevel 1 pause
          endlocal
          '@ | Set-Content "$folder/Start-Living-Sector.cmd" -Encoding ASCII
          @(
            'LIVING SECTOR S4 + OBSERVER UI S2-S4 / TEST BUILD'
            ''
            '1. Extract the folder, do not run inside ZIP.'
            '2. Double-click Start-Living-Sector.cmd (only launcher).'
            '3. The browser opens Observer at localhost:8080/observer.'
            '4. Open Strategy to inspect head decisions, goal assessments and construction progress.'
            '5. This uses Execute mode, x4 speed, and a separate TEST SQLite file next to the EXE.'
            '6. At the bottom of Observer, click Export diagnostics to save a JSON snapshot.'
            '7. This does not include an authoritative history of every previous tick.'
            '8. Old saves are not migrated or overwritten. Stop the server with Ctrl+C.'
            '9. Windows smoke test verifies launch/API/assets, not long autonomous flight.'
          ) | Set-Content "$folder/README.txt" -Encoding UTF8
          New-Item -Path dist -ItemType Directory -Force | Out-Null
          Compress-Archive -Path $folder -DestinationPath 'dist/Living-Sector-S4-Preview-Windows.zip' -CompressionLevel Optimal -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Living-Sector-S4-Preview-Windows
          path: dist/Living-Sector-S4-Preview-Windows.zip
          retention-days: 14
          if-no-files-found: error
