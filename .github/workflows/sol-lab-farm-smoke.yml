name: Sol Lab farm and save smoke

on:
  push:
    branches:
      - feature/sol-lab-clean-20261118
    paths:
      - 'sol_lab/**'
      - '.github/workflows/sol-lab-farm-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sol-lab-farm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sol-lab:
    name: Farm cycle / stall / restore / surface sites
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 150 --silent --show-error \
            'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q -j "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import standalone Sol Lab scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sol-lab-logs"
          godot --version
          if ! timeout --signal=TERM --kill-after=5s 90s \
            godot --headless --path sol_lab --editor --import --quit \
            > "$RUNNER_TEMP/sol-lab-logs/import.log" 2>&1; then
            cat "$RUNNER_TEMP/sol-lab-logs/import.log"
            exit 1
          fi
          if grep -E -i 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/sol-lab-logs/import.log"; then
            cat "$RUNNER_TEMP/sol-lab-logs/import.log"
            exit 1
          fi
      - name: Check farm production, shortage, save/load and layout
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            sol_farm_cycle_check \
            sol_colony_stock_panel_check \
            sol_dock_incremental_check \
            sol_construction_calendar_check \
            sol_ac_start_check \
            sol_building_model_check
          do
            log="$RUNNER_TEMP/sol-lab-logs/${test}.log"
            echo "::group::${test}"
            if ! timeout --signal=TERM --kill-after=5s 55s \
              godot --headless --path sol_lab --script "res://tests/${test}.gd" \
              > "$log" 2>&1; then
              cat "$log"
              echo "::endgroup::"
              exit 1
            fi
            cat "$log"
            case "$test" in
              sol_farm_cycle_check) marker="SOL_FARM_CYCLE_PASS" ;;
              sol_colony_stock_panel_check) marker="SOL_COLONY_STOCK_PANEL_PASS" ;;
              sol_dock_incremental_check) marker="SOL_DOCK_INCREMENTAL_PASS" ;;
              sol_construction_calendar_check) marker="SOL_CONSTRUCTION_CALENDAR_PASS" ;;
              sol_ac_start_check) marker="SOL_AC_START_PASS" ;;
              sol_building_model_check) marker="SOL_LAB_MODEL_PASS" ;;
            esac
            if ! grep -qF "$marker" "$log"; then
              # Each test should explicitly report PASS; a clean exit alone is not enough.
              echo "No PASS marker from ${test}"
              echo "::endgroup::"
              exit 1
            fi
            if grep -E -i 'SCRIPT ERROR|Parse Error|Failed to load script' "$log"; then
              echo "::endgroup::"
              exit 1
            fi
            echo "::endgroup::"
          done
      - name: Parse-check Windows-only draw-position recorder
        shell: bash
        run: |
          godot --headless --path sol_lab --check-only --script res://tests/sol_motion_30s.gd

      - name: Assert visual updates follow source ticks (4s scene)
        shell: bash
        run: |
          set -euo pipefail
          if ! timeout --signal=TERM --kill-after=5s 20s \
            godot --headless --path sol_lab --script res://tests/sol_motion_alignment_check.gd \
            > "$RUNNER_TEMP/sol-lab-logs/motion-alignment.log" 2>&1; then
            cat "$RUNNER_TEMP/sol-lab-logs/motion-alignment.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/sol-lab-logs/motion-alignment.log"
          grep -qF SOL_MOTION_ALIGNMENT_PASS "$RUNNER_TEMP/sol-lab-logs/motion-alignment.log"

      - name: Reproduce lunar colony via actual UI before redesign
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$(mktemp -d)"
          if ! timeout --signal=TERM --kill-after=5s 30s \
            godot --headless --path sol_lab --script res://tests/sol_colony_repro_check.gd \
            > "$RUNNER_TEMP/sol-lab-logs/colony-repro.log" 2>&1; then
            cat "$RUNNER_TEMP/sol-lab-logs/colony-repro.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/sol-lab-logs/colony-repro.log"
          grep -qF SOL_COLONY_REPRO_PASS "$RUNNER_TEMP/sol-lab-logs/colony-repro.log"

      - name: Verify colony construction, saved lunar cargo, globe clicks and window layout
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$(mktemp -d)"
          if ! timeout --signal=TERM --kill-after=5s 45s \
            godot --headless --path sol_lab --script res://tests/sol_colony_window_check.gd \
            > "$RUNNER_TEMP/sol-lab-logs/colony-window.log" 2>&1; then
            cat "$RUNNER_TEMP/sol-lab-logs/colony-window.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/sol-lab-logs/colony-window.log"
          grep -qF SOL_COLONY_WINDOW_PASS "$RUNNER_TEMP/sol-lab-logs/colony-window.log"

      - name: Capture colony layout screenshots when graphical runner is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            echo "Xvfb not installed: geometry was checked headlessly, screenshots unavailable."
          else
            export XDG_DATA_HOME="$(mktemp -d)"
            if timeout --signal=TERM --kill-after=5s 55s \
              xvfb-run -a -s "-screen 0 2560x1440x24" env LIBGL_ALWAYS_SOFTWARE=1 SOL_CAPTURE_UI=1 \
              godot --path sol_lab --script res://tests/sol_colony_window_check.gd \
              > "$RUNNER_TEMP/sol-lab-logs/colony-screenshots.log" 2>&1; then
              grep -E 'SOL_COLONY_SCREENSHOT|SOL_COLONY_WINDOW_PASS' \
                "$RUNNER_TEMP/sol-lab-logs/colony-screenshots.log" || true
            else
              echo "Graphical screenshot run unavailable on CI; see uploaded diagnostic log."
              tail -n 20 "$RUNNER_TEMP/sol-lab-logs/colony-screenshots.log"
            fi
          fi

      - name: Attach optional colony window screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-lab-colony-layout
          path: sol_lab/sol-colony-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate curved Sol colonizer and freight flights, pause and reload
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$(mktemp -d)"
          if ! timeout --signal=TERM --kill-after=5s 50s \
            godot --headless --path sol_lab --script res://tests/sol_ship_flight_check.gd \
            > "$RUNNER_TEMP/sol-lab-logs/ship-flight.log" 2>&1; then
            cat "$RUNNER_TEMP/sol-lab-logs/ship-flight.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/sol-lab-logs/ship-flight.log"
          grep -qF SOL_SHIP_FLIGHT_PASS "$RUNNER_TEMP/sol-lab-logs/ship-flight.log"

      - name: Compare real frame spikes across speed and pause (diagnostic)
        shell: bash
        run: |
          set -euo pipefail
          if ! timeout --signal=TERM --kill-after=5s 65s \
            godot --headless --path sol_lab --script res://tests/sol_hitch_probe.gd \
            > "$RUNNER_TEMP/sol-lab-logs/hitch.log" 2>&1; then
            cat "$RUNNER_TEMP/sol-lab-logs/hitch.log"
            exit 1
          fi
          grep 'SOL_HITCH_' "$RUNNER_TEMP/sol-lab-logs/hitch.log"
          grep -qF SOL_HITCH_PROBE_PASS "$RUNNER_TEMP/sol-lab-logs/hitch.log"

      - name: Attach Sol Lab Godot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-lab-farm-logs
          path: ${{ runner.temp }}/sol-lab-logs/
          if-no-files-found: ignore
          retention-days: 7
