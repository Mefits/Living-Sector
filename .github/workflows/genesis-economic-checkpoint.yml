name: Genesis economic checkpoint checks
on:
  push:
    branches: [feature/genesis-economic-checkpoint, feature/genesis-lifecycle-checkpoint, feature/genesis-flight-recovery, integration/genesis-strategy-prototype, feature/genesis-strategy-replanning, feature/genesis-strategy-construction, feature/genesis-strategy-coordination, feature/genesis-autonomous-execution, feature/genesis-viable-projects, feature/genesis-goal-options, feature/genesis-economy-foundation, feature/genesis-paid-production, feature/genesis-construction-labor, feature/genesis-construction-executor, feature/genesis-station-administrator]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Two focused checkpoint tests
        if: github.ref_name == 'feature/genesis-economic-checkpoint'
        run: cargo test --locked -p sim_db -p sim_server --lib checkpoint_ --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
      - name: Two focused lifecycle tests
        if: github.ref_name == 'feature/genesis-lifecycle-checkpoint'
        run: cargo test --locked -p sim_db -p sim_server --lib lifecycle_ --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
      - name: Three focused flight recovery tests
        if: github.ref_name == 'feature/genesis-flight-recovery'
        run: cargo test --locked -p sim_core -p sim_db -p sim_server --lib flight_recovery_ --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
      - name: Strategy integration checkpoint
        if: github.ref_name == 'integration/genesis-strategy-prototype' || github.ref_name == 'feature/genesis-strategy-replanning' || github.ref_name == 'feature/genesis-strategy-construction' || github.ref_name == 'feature/genesis-strategy-coordination'
        run: |
          cargo test --locked -p sim_core -p sim_db -p sim_server --lib strategy_block_ --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
          cargo test --locked -p sim_core -p sim_db -p sim_server --lib checkpoint_ --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
          cargo test --locked -p sim_core -p sim_db -p sim_server --lib escrow_ --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
          cargo test --locked -p sim_core -p sim_db -p sim_server --lib flight_recovery_ --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
      - name: Strategy runtime API smoke
        if: github.ref_name == 'integration/genesis-strategy-prototype' || github.ref_name == 'feature/genesis-strategy-replanning' || github.ref_name == 'feature/genesis-strategy-construction' || github.ref_name == 'feature/genesis-strategy-coordination'
        run: |
          cargo build --locked -p sim_server --bin genesis_server --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
          python3 tests/strategy-runtime-smoke.py target/debug/genesis_server

      - uses: actions/setup-node@v4
        if: github.ref_name == 'feature/genesis-autonomous-execution' || github.ref_name == 'feature/genesis-viable-projects' || github.ref_name == 'feature/genesis-goal-options'
        with:
          node-version: '24'
      - name: Bounded autonomous Genesis run
        if: github.ref_name == 'feature/genesis-autonomous-execution' || github.ref_name == 'feature/genesis-viable-projects' || github.ref_name == 'feature/genesis-goal-options'
        run: |
          cargo test --locked -p sim_core -p sim_db -p sim_server --lib strategy_block_ --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
          cargo build --locked -p sim_server --bin genesis_server --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
          if [ "${{ github.ref_name }}" = "feature/genesis-viable-projects" ]; then
            node tests/strategy-autonomous.mjs target/debug/genesis_server --both-build
          elif [ "${{ github.ref_name }}" = "feature/genesis-goal-options" ]; then
            node tests/strategy-autonomous.mjs target/debug/genesis_server --head-options
          else
            node tests/strategy-autonomous.mjs target/debug/genesis_server
          fi

      - name: Economic foundation bounded invariants
        if: github.ref_name == 'feature/genesis-economy-foundation'
        run: |
          cargo test --locked -p sim_core -p sim_db -p sim_server --lib foundation_ --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
          cargo test --locked -p sim_db -p sim_server --lib escrow_ --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
          cargo test --locked -p sim_db -p sim_server --lib flight_recovery_ --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
          cargo test --locked -p sim_core -p sim_db -p sim_server --lib strategy_block_ --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
          cargo test --locked -p sim_server --lib engine::transactions::tests --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
          cargo test --locked -p sim_db -p sim_server --lib checkpoint_ --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0

      - name: Paid workforce and native production checkpoint
        if: github.ref_name == 'feature/genesis-paid-production'
        run: |
          cargo test --locked -p sim_core -p sim_db -p sim_server --lib workforce_ --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
          cargo test --locked -p sim_core --lib tick_produce_modules --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
          cargo test --locked -p sim_server --lib engine::transactions::tests --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
          cargo build --locked -p sim_server --bin genesis_server --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
          python3 tests/workforce-runtime-smoke.py target/debug/genesis_server

      - name: Construction labor checkpoint
        if: github.ref_name == 'feature/genesis-construction-labor' || github.ref_name == 'feature/genesis-construction-executor'
        run: |
          cargo test --locked -p sim_core -p sim_db -p sim_server --lib construction --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
          cargo test --locked -p sim_core -p sim_server --lib workforce_ --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
          cargo test --locked -p sim_server --lib engine::transactions::tests --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
          cargo test --locked -p sim_core --lib strategy_block_head_compares_build_deliver --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
          cargo build --locked -p sim_server --bin genesis_server --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
          python3 tests/workforce-runtime-smoke.py target/debug/genesis_server

      - name: Station administrator decisions and native payroll
        if: github.ref_name == 'feature/genesis-station-administrator'
        run: |
          cargo test --locked -p sim_core --lib station_admin_ --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
          cargo test --locked -p sim_core -p sim_server --lib workforce_ --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
          cargo test --locked -p sim_server --lib construction_labor_checkpoint --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
          cargo build --locked -p sim_server --bin genesis_server --config 'profile.dev.package."*".opt-level=0' --config profile.dev.opt-level=0
          python3 tests/station-admin-runtime-smoke.py target/debug/genesis_server
