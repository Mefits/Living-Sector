<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Living Sector — Observer</title>
  <link rel="stylesheet" href="/observer/styles.css">
</head>
<body>
<div class="shell">
  <header class="toolbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">◈</span><span>LIVING SECTOR</span></div>
    <div class="view-tabs" aria-label="Масштаб карты">
      <button id="sector-tab" class="tab active" aria-pressed="true">Сектор</button>
      <button id="system-tab" class="tab" aria-pressed="false" disabled>Система</button>
    </div>
    <div class="controls">
      <div id="connection" class="status" role="status"><span class="status-dot"></span><span id="connection-text">Подключение…</span></div>
      <button id="pause-btn" class="control-button primary" disabled>Продолжить</button>
      <label for="speed-select" class="sr-only">Скорость симуляции</label>
      <select id="speed-select" class="control-button" disabled>
        <option value="0.25">0,25×</option>
        <option value="1">1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
        <option value="8">8×</option>
        <option value="16">16×</option>
      </select>
    </div>
  </header>

  <div class="workspace">
    <main class="main">
      <section class="map-section" aria-label="Карта">
        <div class="map-top">
          <div class="map-title">
            <h1 id="map-title">Сектор</h1>
            <span id="map-summary"></span>
          </div>
          <div class="map-tools">
            <details id="system-picker" class="popover">
              <summary>Системы</summary>
              <div class="popover-panel">
                <label class="sr-only" for="system-search">Поиск системы</label>
                <input id="system-search" class="search" type="search" placeholder="Поиск системы…" autocomplete="off">
                <div id="system-list" class="system-list"><div class="empty">Ожидание данных</div></div>
                <div id="faction-legend" class="faction-list" aria-label="Фракции"></div>
              </div>
            </details>
            <details id="map-layers" class="popover">
              <summary>Слои</summary>
              <div class="popover-panel layer-options">
                <label class="toggle"><input id="ships-toggle" type="checkbox"> Корабли</label>
                <label class="toggle"><input id="links-toggle" type="checkbox" checked> Врата</label>
                <label class="toggle"><input id="labels-toggle" type="checkbox" checked> Подписи</label>
              </div>
            </details>
            <button id="fit-btn" class="small-button" title="Сброс масштаба и сдвига">Сброс вида</button>
          </div>
        </div>
        <div id="canvas-holder" class="canvas-holder">
          <canvas id="map" tabindex="0" aria-label="Карта. Колесо меняет масштаб, перетаскивание сдвигает карту."></canvas>
          <div id="hover-label" class="hover-label" hidden></div>
          <div id="map-error" class="map-error" hidden>Связь потеряна. Показано последнее полученное состояние.</div>
          <div id="map-legend" class="map-legend" aria-label="Условные обозначения" hidden>
            <span><i class="legend-body"></i> Тело</span><span><i class="legend-hub"></i> Хаб</span><span><i class="legend-ship"></i> Корабль</span>
          </div>
        </div>
      </section>

      <section class="activity" aria-label="Флот и события">
        <div class="activity-bar">
          <div id="fleet-strip" class="fleet-strip" aria-label="Корабли системы" hidden></div>
          <button id="events-toggle" class="small-button events-toggle" aria-expanded="false" aria-controls="timeline">Журнал <span id="event-count">0</span></button>
        </div>
        <div id="timeline" class="timeline" hidden>
          <header class="timeline-title"><strong>Последние события</strong><button id="clear-events" class="flat-button">Очистить</button></header>
          <div id="event-feed" class="event-feed"><div class="empty">События появятся по мере работы симуляции</div></div>
        </div>
      </section>
    </main>

    <aside id="inspector" class="inspector" aria-label="Карточка объекта" hidden>
      <header class="inspector-header">
        <button id="inspector-back" class="flat-button" hidden>← Назад</button>
        <button id="clear-selection" class="flat-button close-button" aria-label="Закрыть карточку">✕</button>
      </header>
      <div id="inspector-body" class="inspector-body"></div>
    </aside>
  </div>
</div>
<script type="module" src="/observer/app.js"></script>
</body>
</html>
