<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Saturn | Rings and atmosphere">
<title>Saturn | Rings and atmosphere</title>
<defs>
<clipPath id="disc"><circle cx="128" cy="128" r="66"/></clipPath>
<linearGradient id="sphere" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0ce96"/><stop offset="1" stop-color="#c99b60"/></linearGradient>
<linearGradient id="shade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fae0aa" stop-opacity=".25"/><stop offset="1" stop-color="#624e40" stop-opacity=".10"/></linearGradient>
</defs>
<!-- Back portion of the eccentric orbital rings -->
<g transform="rotate(-14 128 128)" fill="none">
<ellipse cx="128" cy="128" rx="119" ry="32" stroke="#e1c298" stroke-width="13"/>
<ellipse cx="128" cy="128" rx="118" ry="32" stroke="#37424b" stroke-width="4"/>
<ellipse cx="128" cy="128" rx="104" ry="24" stroke="#d1af83" stroke-width="6"/>
<ellipse cx="128" cy="128" rx="96" ry="22" stroke="#36414a" stroke-width="4"/>
</g>
<g clip-path="url(#disc)">
<circle cx="128" cy="128" r="66" fill="url(#sphere)"/>
<path d="M 48 84 C 88 94 155 85 207 72 L 207 93 C 166 99 102 103 46 98Z" fill="#ddae75"/>
<path d="M 40 107 C 86 113 155 107 210 95 L 210 111 C 167 125 89 127 45 117Z" fill="#eac38c"/>
<path d="M 43 133 C 97 125 157 122 208 111 L 207 129 C 163 143 93 151 48 145Z" fill="#cda06a"/>
<path d="M 41 157 C 91 151 156 144 209 129 L 207 145 C 163 161 99 169 44 169Z" fill="#e2b77e"/>
<path d="M 55 179 C 106 175 155 166 198 150 L 198 166 C 155 183 97 187 54 188Z" fill="#d0a16a"/>
<circle cx="128" cy="128" r="66" fill="url(#shade)"/>
</g>
<!-- Front portion of rings: top half stays behind the planet. -->
<g transform="rotate(-14 128 128)" fill="none" stroke-linecap="round">
<path d="M 9 128 A 119 32 0 0 0 247 128" stroke="#ead0a6" stroke-width="13"/>
<path d="M 9 128 A 119 32 0 0 0 247 128" stroke="#3b4550" stroke-width="4"/>
<path d="M 24 128 A 104 24 0 0 0 232 128" stroke="#dcb78a" stroke-width="6"/>
<path d="M 32 128 A 96 22 0 0 0 224 128" stroke="#37414a" stroke-width="4"/>
</g>
</svg>
