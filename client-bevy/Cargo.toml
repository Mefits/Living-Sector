[package]
name = "client_bevy"
version = "0.1.0"
edition = "2021"
authors = ["David Clausen"]

# Bevy client for the spaceproject simulator. See `../simulator-rust/`
# for the server side and `../client/` for the existing Godot client
# that this crate is progressively replacing (see the
# session-level plan in `.claude/plans/`).
#
# Structure:
#   src/main.rs       ← app bootstrap
#   src/net/          ← WS + HTTP client, subprocess lifecycle
#   src/world/        ← world-state resources + systems
#   src/render/       ← mesh / material / instancing systems
#   src/camera/       ← isometric cam + observer feedback
#   src/ui/           ← egui inspector panels
#   src/hud/          ← in-world HUD (labels, selection ring)
#   src/admin/        ← admin controls (god toolbar, spawn, supply)

[dependencies]
# Shared wire protocol with the sim — no re-declared types.
sim_protocol = { path = "../simulator-rust/crates/sim_protocol" }

# Engine. Version-pinned intentionally — Bevy's API moves; bundle-by-
# bundle upgrades are allowed, mid-bundle upgrades are not.
bevy = "0.14"
bevy_egui = "0.30"

# Async / networking
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
url = "2"

# Serialization (re-exported through sim_protocol but we need for
# serializing ClientMsg side + decoding raw frames).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Concurrency primitives for WS → Bevy hand-off
flume = "0.11"

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
